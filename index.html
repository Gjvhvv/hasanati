<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>حسناتي</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E3B2E">
<link rel="icon" href="icons/icon-192.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap');

:root{
  --green:#0E3B2E;
  --green2:#1F5C46;
  --gold:#B8863E;
  --paper:#F6EFDD;
  --paper2:#EFE6CE;
  --ink:#1C1B16;
  --muted:#77694f;
  --line:#ddd0ac;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  padding-bottom:75px;
}

button,
input,
select{
  font-family:'Tajawal',sans-serif;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--green);
  color:var(--paper);
  border-bottom:3px solid var(--gold);
}

.header-row{
  max-width:760px;
  margin:auto;
  display:flex;
  align-items:center;
  padding:10px 12px;
}

.icon-btn{
  background:none;
  border:0;
  color:white;
  padding:8px;
  cursor:pointer;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:active{
  background:rgba(255,255,255,.12);
}

.icon-btn svg{
  width:22px;
  height:22px;
}

.app-title{
  flex:1;
  text-align:center;
  font-family:'Amiri Quran',serif;
  font-size:1.2rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.header-actions{
  display:flex;
  align-items:center;
}

.search-wrap{
  max-width:760px;
  margin:auto;
  max-height:0;
  overflow:hidden;
  transition:.25s;
}

.search-wrap.open{
  max-height:80px;
  padding:8px 12px 12px;
}

.search-row{
  display:flex;
  gap:7px;
}

.search-row input{
  flex:1;
  min-width:0;
  padding:10px;
  border:1px solid rgba(255,255,255,.3);
  border-radius:8px;
  outline:none;
  background:rgba(255,255,255,.08);
  color:white;
}

.search-row input::placeholder{
  color:rgba(255,255,255,.6);
}

.search-row button{
  border:0;
  border-radius:8px;
  background:var(--gold);
  color:var(--green);
  font-weight:bold;
  padding:0 15px;
}

/* MAIN */

main{
  width:100%;
  max-width:760px;
  margin:auto;
  padding:15px 12px 35px;
}

.state{
  text-align:center;
  padding:50px 15px;
  color:var(--muted);
  line-height:2;
}

/* HOME */

.hero{
  text-align:center;
  padding:20px 5px;
  border-bottom:1px solid var(--line);
  margin-bottom:16px;
}

.bismillah{
  font-family:'Amiri Quran',serif;
  color:var(--green);
  font-size:1.8rem;
  margin:0;
}

.hero p:last-child{
  color:var(--muted);
  font-size:.85rem;
}

.continue{
  background:var(--green);
  color:white;
  border-radius:10px;
  padding:13px;
  margin-bottom:15px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.continue strong{
  color:#EDE0BD;
}

.continue-clear{
  background:none;
  border:0;
  color:white;
  font-size:18px;
}

.tabs{
  display:flex;
  gap:7px;
  margin-bottom:15px;
}

.tab{
  flex:1;
  padding:10px 5px;
  border:1px solid var(--line);
  background:var(--paper2);
  color:var(--muted);
  border-radius:8px;
  font-weight:bold;
}

.tab.active{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

/* SURAH LIST */

.surah{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 4px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.surah:active{
  background:var(--paper2);
}

.surah-number{
  width:38px;
  height:38px;
  border:1.5px solid var(--gold);
  border-radius:9px;
  display:flex;
  justify-content:center;
  align-items:center;
  color:var(--green);
  font-weight:bold;
  flex-shrink:0;
}

.surah-info{
  flex:1;
}

.surah-name{
  font-family:'Amiri Quran',serif;
  font-size:1.15rem;
}

.surah-meta{
  color:var(--muted);
  font-size:.8rem;
  margin-top:3px;
}

/* READING */

.reader{
  width:100%;
}

.reader-top{
  position:sticky;
  top:59px;
  z-index:20;
  background:var(--paper);
  padding:7px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  border-bottom:1px solid var(--line);
}

.reader-btn{
  border:1px solid var(--gold);
  background:var(--paper2);
  color:var(--green);
  border-radius:8px;
  padding:8px 11px;
  font-weight:bold;
  cursor:pointer;
}

.reader-btn:disabled{
  opacity:.35;
}

.reader-position{
  text-align:center;
  color:var(--muted);
  font-size:.8rem;
}

.quran-card{
  background:#fffdf5;
  margin-top:10px;
  padding:25px 14px 40px;
  border:1px solid var(--gold);
  border-radius:5px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.surah-heading{
  text-align:center;
  color:var(--green);
  font-family:'Amiri Quran',serif;
  font-size:1.6rem;
  margin-bottom:8px;
}

.surah-details{
  text-align:center;
  color:var(--muted);
  font-size:.8rem;
  margin-bottom:20px;
}

.quran-bismillah{
  text-align:center;
  font-family:'Amiri Quran',serif;
  font-size:1.45rem;
  color:var(--green);
  margin:15px 0 25px;
}

.quran-text{
  font-family:'Amiri Quran',serif;
  font-size:1.65rem;
  line-height:2.5;
  text-align:justify;
  direction:rtl;
}

.ayah{
  display:inline;
  cursor:pointer;
}

.ayah.playing{
  background:#EDE0BD;
  border-radius:5px;
}

.ayah-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:29px;
  height:29px;
  border:1.5px solid var(--gold);
  border-radius:50%;
  font-family:'Tajawal',sans-serif;
  font-size:.72rem;
  color:var(--green);
  margin:0 4px;
  vertical-align:middle;
}

.reader-bottom{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.reader-bottom button{
  flex:1;
}

/* READING HOME */

.reading-home{
  text-align:center;
  padding:20px 5px;
}

.reading-home .icon{
  font-size:55px;
}

.reading-home h2{
  color:var(--green);
  font-family:'Amiri Quran',serif;
  font-size:1.8rem;
}

.reading-home p{
  color:var(--muted);
  line-height:2;
}

.start{
  width:100%;
  border:0;
  border-radius:9px;
  background:var(--green);
  color:white;
  padding:14px;
  font-weight:bold;
  font-size:1rem;
  cursor:pointer;
}

.last-reading{
  margin-top:10px;
  border:1px solid var(--line);
  background:var(--paper2);
  border-radius:9px;
  padding:12px;
  color:var(--muted);
  cursor:pointer;
}

/* SEARCH */

.search-result{
  padding:15px 4px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.search-ref{
  color:var(--gold);
  font-size:.8rem;
  font-weight:bold;
}

.search-text{
  font-family:'Amiri Quran',serif;
  font-size:1.25rem;
  line-height:2.2;
  margin-top:5px;
}

mark{
  background:#EDE0BD;
}

/* AUDIO */

#audio{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:200;
  background:var(--green);
  color:white;
  border-top:3px solid var(--gold);
  display:none;
  align-items:center;
  gap:8px;
  padding:8px 10px;
}

#audio.show{
  display:flex;
}

.audio-info{
  flex:1;
  min-width:0;
}

.audio-surah{
  font-family:'Amiri Quran',serif;
}

.audio-ayah{
  color:#EDE0BD;
  font-size:.75rem;
}

/* TOAST */

#toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  background:var(--green);
  color:white;
  border:1px solid var(--gold);
  padding:9px 16px;
  border-radius:20px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:300;
}

#toast.show{
  opacity:1;
}

/* MOBILE */

@media(max-width:600px){

  main{
    padding:10px 7px 30px;
  }

  .reader-top{
    top:58px;
  }

  .quran-card{
    padding:22px 11px 35px;
  }

  .quran-text{
    font-size:1.45rem;
    line-height:2.35;
  }

  .ayah-number{
    width:27px;
    height:27px;
    font-size:.68rem;
  }

  .quran-bismillah{
    font-size:1.3rem;
  }

  .surah-heading{
    font-size:1.45rem;
  }
}

@media(max-width:380px){

  .quran-text{
    font-size:1.35rem;
    line-height:2.2;
  }
}
</style>
</head>
