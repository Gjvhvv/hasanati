<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حسناتي</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E3B2E">
<link rel="icon" href="icons/icon-192.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap');

:root{
  --ink:#1C1B16;
  --paper:#F6EFDD;
  --paper-2:#EFE6CE;
  --green-deep:#0E3B2E;
  --green-mid:#1F5C46;
  --gold:#B8863E;
  --gold-soft:#EDE0BD;
  --muted:#77694f;
  --line:#ddd0ac;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  padding-bottom:70px;
  overscroll-behavior-x:none;
}

button,input,select{
  font-family:inherit;
}

button{
  touch-action:manipulation;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--green-deep);
  color:var(--paper);
  border-bottom:3px solid var(--gold);
}

.header-row{
  max-width:720px;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:2px;
  flex-shrink:0;
}

.icon-btn{
  background:none;
  border:none;
  color:var(--paper);
  cursor:pointer;
  padding:6px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.icon-btn:hover{
  background:rgba(255,255,255,.1);
}

.icon-btn svg{
  width:22px;
  height:22px;
}

.app-title{
  flex:1;
  text-align:center;
  font-size:1.15rem;
  font-weight:700;
  font-family:'Amiri Quran',serif;
  letter-spacing:.5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.search-bar-wrap{
  max-width:720px;
  margin:0 auto;
  padding:0 16px;
  overflow:hidden;
  max-height:0;
  transition:max-height .25s ease,padding .25s ease;
}

.search-bar-wrap.open{
  max-height:70px;
  padding:10px 16px;
}

.search-input-row{
  display:flex;
  gap:8px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.25);
  border-radius:8px;
  padding:4px;
}

.search-input-row input{
  flex:1;
  background:none;
  border:none;
  outline:none;
  color:var(--paper);
  font-size:1rem;
  padding:8px 10px;
}

.search-input-row input::placeholder{
  color:rgba(255,255,255,.55);
}

.search-input-row button{
  background:var(--gold);
  border:none;
  color:var(--green-deep);
  font-weight:700;
  border-radius:6px;
  padding:0 16px;
  cursor:pointer;
}

/* ================= MAIN ================= */

main{
  max-width:720px;
  margin:0 auto;
  padding:20px 16px 40px;
}

.state-msg{
  text-align:center;
  color:var(--muted);
  padding:40px 10px;
  font-size:.95rem;
}

/* ================= HOME ================= */

.hero{
  text-align:center;
  padding:18px 10px 26px;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}

.hero .bismillah{
  font-family:'Amiri Quran',serif;
  font-size:2rem;
  color:var(--green-deep);
  margin:0 0 6px;
}

.hero .sub{
  color:var(--muted);
  font-size:.9rem;
  margin:0;
}

.continue-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--green-deep);
  color:var(--paper);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:16px;
  cursor:pointer;
}

.continue-text{
  font-size:.92rem;
}

.continue-text strong{
  font-family:'Amiri Quran',serif;
  font-size:1.05rem;
  color:var(--gold);
}

.continue-clear{
  background:none;
  border:none;
  color:var(--paper);
  opacity:.75;
  font-size:1rem;
  cursor:pointer;
  padding:2px 6px;
}

.home-tabs{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.home-tab{
  flex:1;
  background:var(--paper-2);
  border:1.5px solid var(--line);
  color:var(--muted);
  border-radius:8px;
  padding:9px 0;
  font-weight:700;
  font-size:.92rem;
  cursor:pointer;
}

.home-tab.active{
  background:var(--green-deep);
  color:var(--paper);
  border-color:var(--green-deep);
}

.page-jump-row{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.page-jump-row input,
.hadith-jump-row input{
  flex:1;
  border:1.5px solid var(--gold);
  border-radius:8px;
  padding:9px 10px;
  font-size:.95rem;
  background:var(--paper-2);
  color:var(--ink);
}

.page-jump-row button,
.hadith-jump-row button{
  background:var(--gold);
  border:none;
  color:var(--green-deep);
  font-weight:700;
  border-radius:8px;
  padding:0 18px;
  cursor:pointer;
}

.surah-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:13px 4px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.surah-row:hover{
  background:var(--paper-2);
}

.surah-num{
  flex-shrink:0;
  width:34px;
  height:34px;
  border:1.5px solid var(--gold);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green-deep);
  font-weight:700;
  font-size:.9rem;
}

.surah-info{
  flex:1;
  min-width:0;
}

.surah-name{
  font-family:'Amiri Quran',serif;
  font-size:1.15rem;
  color:var(--ink);
}

.surah-meta{
  color:var(--muted);
  font-size:.82rem;
  margin-top:2px;
}

.surah-arrow{
  color:var(--muted);
  flex-shrink:0;
}

/* ================= QURAN READING ================= */

.reading-page{
  width:100%;
  margin:0 auto;
}

.mushaf-top{
  text-align:center;
  margin-bottom:10px;
}

.mushaf-title{
  font-family:'Amiri Quran',serif;
  color:var(--green-deep);
  font-size:1.5rem;
  margin:0 0 4px;
}

.mushaf-page-number{
  color:var(--muted);
  font-size:.85rem;
}

.mushaf-controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin:10px 0;
}

.mushaf-nav{
  background:var(--paper-2);
  border:1.5px solid var(--gold);
  color:var(--green-deep);
  border-radius:8px;
  padding:9px 14px;
  font-weight:700;
  cursor:pointer;
}

.mushaf-nav:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.mushaf-hint{
  text-align:center;
  color:var(--muted);
  font-size:.78rem;
  margin:8px 0 12px;
}

/*
  شاشة المصحف
*/

.mushaf-screen{
  width:100%;
  background:#fffdf5;
  border:1px solid var(--line);
  border-radius:4px;
  overflow:hidden;
  position:relative;
  box-shadow:0 2px 10px rgba(0,0,0,.08);

  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
}

.mushaf-image{
  display:block;
  width:100%;
  height:auto;
  min-height:60vh;
  object-fit:contain;
  background:#fffdf5;
}

/*
  في الهاتف نجعل المصحف تقريباً بطول الشاشة.
*/

@media(max-width:720px){

  body{
    padding-bottom:0;
  }

  header{
    position:sticky;
    top:0;
  }

  main{
    max-width:none;
    padding:8px 0 20px;
  }

  .reading-page{
    width:100%;
  }

  .mushaf-top{
    padding:5px 12px 0;
  }

  .mushaf-controls{
    padding:0 10px;
  }

  .mushaf-hint{
    padding:0 10px;
  }

  .mushaf-screen{
    width:100vw;
    max-width:100vw;
    border-left:0;
    border-right:0;
    border-radius:0;
    box-shadow:none;
    background:#fffdf5;

    /*
      محاولة ملء مساحة الهاتف.
    */
    min-height:calc(100vh - 175px);
    display:flex;
    align-items:flex-start;
    justify-content:center;
  }

  .mushaf-image{
    width:100%;
    max-width:100%;
    min-height:calc(100vh - 175px);
    object-fit:contain;
  }
}

/* ================= SURAH READING ================= */

.surah-heading{
  text-align:center;
  padding:6px 0 20px;
}

.surah-heading h2{
  font-family:'Amiri Quran',serif;
  font-size:1.7rem;
  color:var(--green-deep);
  margin:0 0 6px;
}

.surah-heading .meta{
  color:var(--muted);
  font-size:.85rem;
}

.reciter-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin:14px 0 4px;
  flex-wrap:wrap;
}

.reciter-label{
  color:var(--muted);
  font-size:.85rem;
}

.reciter-select{
  background:var(--paper-2);
  color:var(--ink);
  border:1.5px solid var(--gold);
  border-radius:8px;
  padding:6px 10px;
  font-size:.88rem;
}

.reciter-warning{
  text-align:center;
  color:#8a3b2b;
  font-size:.8rem;
  margin:6px auto 14px;
  max-width:340px;
}

.bismillah-line{
  text-align:center;
  font-family:'Amiri Quran',serif;
  font-size:1.6rem;
  color:var(--green-deep);
  margin:8px 0 26px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}

.ayah-block{
  padding:16px 10px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  transition:background .2s ease;
}

.ayah-block.playing{
  background:var(--gold-soft);
}

.ayah-text{
  font-family:'Amiri Quran',serif;
  font-size:1.55rem;
  line-height:2.5;
  margin:0;
  text-align:right;
}

.ayah-marker{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:30px;
  height:30px;
  margin:0 4px;
  border:1.5px solid var(--gold);
  border-radius:50%;
  font-size:.85rem;
  color:var(--green-deep);
  vertical-align:middle;
}

.ayah-tools{
  display:flex;
  gap:10px;
  margin-top:6px;
}

.tafsir-toggle{
  background:none;
  border:none;
  color:var(--green-mid);
  font-size:.85rem;
  font-weight:700;
  cursor:pointer;
  padding:4px 2px;
  border-bottom:1px dashed var(--green-mid);
}

.tafsir-text{
  margin-top:10px;
  padding:10px 12px;
  background:var(--paper-2);
  border-radius:6px;
  font-size:.92rem;
  line-height:1.9;
}

.play-surah-btn{
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:center;
  margin:0 auto 14px;
  background:var(--green-deep);
  color:var(--paper);
  border:none;
  border-radius:8px;
  padding:10px 22px;
  font-size:.95rem;
  font-weight:700;
  cursor:pointer;
}

/* ================= HADITH ================= */

.hadith-nav-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:6px 0 18px;
  gap:10px;
}

.hadith-jump-row{
  display:flex;
  gap:8px;
  margin:0 0 18px;
}

.grade-banner{
  display:flex;
  align-items:center;
  gap:8px;
  border-radius:8px;
  padding:11px 14px;
  margin-bottom:18px;
  font-size:.92rem;
  font-weight:700;
  line-height:1.6;
}

.grade-banner.weak{
  background:#f6dcd6;
  color:#7a2416;
  border:1.5px solid #b3543c;
}

.grade-banner.disputed{
  background:#f8ecd0;
  color:#7a5a10;
  border:1.5px solid #b8863e;
}

.hadith-card{
  padding:6px 4px 22px;
}

.hadith-text{
  font-family:'Amiri Quran',serif;
  font-size:1.3rem;
  line-height:2.3;
  margin:0 0 18px;
  text-align:right;
}

.hadith-source{
  background:var(--paper-2);
  border-radius:8px;
  padding:12px 14px;
  color:var(--muted);
  font-size:.86rem;
  line-height:1.9;
}

.hadith-source strong{
  color:var(--green-deep);
}

.hadith-source .src-name{
  font-family:'Amiri Quran',serif;
  font-size:1rem;
  color:var(--green-deep);
}

.hadith-num-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:30px;
  height:30px;
  padding:0 6px;
  margin:0 4px;
  border:1.5px solid var(--gold);
  border-radius:50%;
  font-size:.85rem;
  color:var(--green-deep);
  vertical-align:middle;
}

/* ================= SEARCH ================= */

.search-result{
  padding:14px 4px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.search-result:hover{
  background:var(--paper-2);
}

.search-result .ref{
  color:var(--gold);
  font-size:.8rem;
  font-weight:700;
  margin-bottom:6px;
}

.search-result .txt{
  font-family:'Amiri Quran',serif;
  font-size:1.25rem;
  line-height:2;
}

mark{
  background:var(--gold-soft);
  color:var(--ink);
  padding:0 2px;
  border-radius:3px;
}

/* ================= AUDIO ================= */

#audio-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  background:var(--green-deep);
  color:var(--paper);
  border-top:3px solid var(--gold);
  display:none;
  align-items:center;
  gap:14px;
  padding:10px 16px;
}

#audio-bar.show{
  display:flex;
}

.audio-info{
  flex:1;
  min-width:0;
  font-size:.9rem;
}

.audio-info .s-name{
  font-family:'Amiri Quran',serif;
  font-size:1.05rem;
}

.audio-info .a-num{
  color:var(--gold);
  font-size:.8rem;
}

/* ================= TOAST ================= */

#toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--green-deep);
  color:var(--paper);
  padding:10px 18px;
  border-radius:20px;
  font-size:.88rem;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
  z-index:40;
  border:1px solid var(--gold);
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:420px){

  .ayah-text{
    font-size:1.35rem;
    line-height:2.3;
  }

  .hero .bismillah{
    font-size:1.6rem;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-row">

    <button
      class="icon-btn"
      id="back-btn"
      style="display:none"
      aria-label="رجوع">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M15 6l-6 6 6 6"/>

      </svg>

    </button>

    <div class="app-title" id="app-title">
      حسناتي
    </div>

    <div class="header-actions">

      <button
        class="icon-btn"
        id="bookmark-btn"
        style="display:none"
        aria-label="حفظ مكاني">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">

          <path d="M6 4h12v16l-6-4-6 4V4z"/>

        </svg>

      </button>

      <button
        class="icon-btn"
        id="search-btn"
        aria-label="بحث">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2">

          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.3-4.3"/>

        </svg>

      </button>

    </div>
  </div>

  <div class="search-bar-wrap" id="search-wrap">

    <div class="search-input-row">

      <input
        type="text"
        id="search-input"
        placeholder="ابحث في آيات القرآن الكريم...">

      <button id="search-go">
        بحث
      </button>

    </div>

  </div>

</header>

<main id="app">

  <div class="state-msg">
    جاري التحميل...
  </div>

</main>

<div id="audio-bar">

  <button
    class="icon-btn"
    id="audio-toggle"
    aria-label="تشغيل / إيقاف">

    <svg
      id="audio-icon"
      viewBox="0 0 24 24"
      fill="currentColor">

      <path d="M8 5v14l11-7z"/>

    </svg>

  </button>

  <div class="audio-info">

    <div
      class="s-name"
      id="audio-surah-name">
    </div>

    <div
      class="a-num"
      id="audio-ayah-num">
    </div>

  </div>

  <button
    class="icon-btn"
    id="audio-stop"
    aria-label="إيقاف">

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2">

      <path d="M6 6l12 12M18 6L6 18"/>

    </svg>

  </button>

</div>

<div id="toast"></div>


<script>

/* =====================================================

/* =====================================================
   ARABIC NUMBERS
===================================================== */

const arDigits =
  ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];

function toAr(n){

  return String(n).replace(
    /[0-9]/g,
    d => arDigits[d]
  );

}


/* =====================================================
   HELPERS
===================================================== */

function revTypeAr(t){

  return t === 'Meccan'
    ? 'مكية'
    : 'مدنية';

}

function escapeReg(s){

  return s.replace(
    /[.*+?^${}()|[\]\\]/g,
    '\\$&'
  );

}

function pad3(n){

  return String(n).padStart(3,'0');

}


/* =====================================================
   TOAST
===================================================== */

function showToast(msg){

  toastEl.textContent = msg;

  toastEl.classList.add('show');

  clearTimeout(showToast._t);

  showToast._t =
    setTimeout(
      () => toastEl.classList.remove('show'),
      1800
    );

}


/* =====================================================
   BOOKMARK
===================================================== */

function getBookmark(){

  try{

    const raw =
      localStorage.getItem(BOOKMARK_KEY);

    return raw
      ? JSON.parse(raw)
      : null;

  }catch(e){

    return null;

  }

}

function saveBookmark(data){

  try{

    localStorage.setItem(
      BOOKMARK_KEY,
      JSON.stringify(data)
    );

  }catch(e){}

}

function clearBookmark(){

  try{

    localStorage.removeItem(
      BOOKMARK_KEY
    );

  }catch(e){}

}


/* =====================================================
   AUTO SAVE READING PAGE
===================================================== */

function getLastReadingPage(){

  try{

    const n =
      Number(
        localStorage.getItem(
          READING_PAGE_KEY
        )
      );

    if(
      Number.isInteger(n) &&
      n >= 1 &&
      n <= PAGES_TOTAL
    ){

      return n;

    }

  }catch(e){}

  return 1;

}


function saveLastReadingPage(page){

  try{

    localStorage.setItem(
      READING_PAGE_KEY,
      String(page)
    );

  }catch(e){}

  /*
    كذلك نحفظها كعلامة متابعة.
  */

  saveBookmark({

    type:'page',
    number:page,
    label:'الصفحة ' + toAr(page)

  });

}

/* =====================================================
   RENDER MUSHAF
===================================================== */

function renderMushaf(
  pageNumber
){

  pageNumber =
    Number(pageNumber);


  if(
    !pageNumber ||
    pageNumber < 1 ||
    pageNumber > PAGES_TOTAL
  ){

    pageNumber = 1;

  }


  stopAudio();


  currentPageNumber =
    pageNumber;


  currentView = {

    type:'page',

    number:pageNumber

  };


  /* حفظ تلقائي */

  saveLastReadingPage(
    pageNumber
  );


  app.innerHTML = `

    <div class="reading-page">

      <div class="mushaf-top">

        <div class="mushaf-title">
          القرآن الكريم
        </div>

        <div
          class="mushaf-page-number"
          id="mushaf-page-number">

          الصفحة
          ${toAr(pageNumber)}
          من
          ${toAr(PAGES_TOTAL)}

        </div>

      </div>


      <div class="mushaf-controls">

        <button
          class="mushaf-nav"
          id="mushaf-next"
          ${pageNumber >= PAGES_TOTAL ? 'disabled' : ''}>

          الصفحة التالية ›

        </button>


        <button
          class="mushaf-nav"
          id="mushaf-save">

          حفظ

        </button>


        <button
          class="mushaf-nav"
          id="mushaf-prev"
          ${pageNumber <= 1 ? 'disabled' : ''}>

          ‹ الصفحة السابقة

        </button>

      </div>


      <div class="mushaf-hint">

        اسحب بإصبعك
        ← الصفحة التالية
        ·
        الصفحة السابقة →

      </div>


      <div
        class="mushaf-screen"
        id="mushaf-screen">

        <img
          class="mushaf-image"
          id="mushaf-image"
          src="${mushafImageUrl(pageNumber)}"
          alt="صفحة القرآن الكريم ${toAr(pageNumber)}"
          draggable="false">

      </div>

    </div>

  `;


  const next =
    document.getElementById(
      'mushaf-next'
    );

  const prev =
    document.getElementById(
      'mushaf-prev'
    );

  const save =
    document.getElementById(
      'mushaf-save'
    );

  const image =
    document.getElementById(
      'mushaf-image'
    );

  const screen =
    document.getElementById(
      'mushaf-screen'
    );


  /* ==========================================
     fallback للصورة
  ========================================== */

  image.addEventListener(
    'error',
    function(){

      if(
        !image.dataset.fallback
      ){

        image.dataset.fallback =
          '1';

        image.src =
          mushafImageUrlFallback(
            pageNumber
          );

      }else{

        image.removeAttribute(
          'src'
        );

        image.alt =
          'تعذر تحميل صورة صفحة المصحف';

        image.style.minHeight =
          '70vh';

        image.style.display =
          'flex';

        image.style.padding =
          '30px';

        image.insertAdjacentHTML(
          'afterend',
          `
          <div
            style="
              position:absolute;
              inset:0;
              display:flex;
              align-items:center;
              justify-content:center;
              text-align:center;
              padding:30px;
              color:#77694f;
              background:#fffdf5;
            ">

            تعذر تحميل صورة المصحف من الخادم.
            <br><br>
            تأكد من اتصال الإنترنت ثم أعد المحاولة.

          </div>
          `
        );

      }

    }
  );


  /* ==========================================
     NEXT
  ========================================== */

  next.addEventListener(
    'click',
    () => {

      if(
        pageNumber <
        PAGES_TOTAL
      ){

        goToMushafPage(
          pageNumber + 1
        );

      }

    }
  );


  /* ==========================================
     PREVIOUS
  ========================================== */

  prev.addEventListener(
    'click',
    () => {

      if(
        pageNumber > 1
      ){

        goToMushafPage(
          pageNumber - 1
        );

      }

    }
  );


  /* ==========================================
     SAVE
  ========================================== */

  save.addEventListener(
    'click',
    () => {

      saveLastReadingPage(
        pageNumber
      );

      showToast(
        'تم حفظ مكان القراءة ✓'
      );

    }
  );


  /* ==========================================
     SWIPE
  ========================================== */

  let touchStartX = 0;

  let touchStartY = 0;

  let touchStartTime = 0;


  screen.addEventListener(
    'touchstart',
    e => {

      if(
        !e.touches ||
        !e.touches.length
      ){

        return;

      }

      const touch =
        e.touches[0];

      touchStartX =
        touch.clientX;

      touchStartY =
        touch.clientY;

      touchStartTime =
        Date.now();

    },
    {
      passive:true
    }
  );


  screen.addEventListener(
    'touchend',
    e => {

      if(
        !e.changedTouches ||
        !e.changedTouches.length
      ){

        return;

      }

      const touch =
        e.changedTouches[0];

      const endX =
        touch.clientX;

      const endY =
        touch.clientY;

      const dx =
        endX - touchStartX;

      const dy =
        endY - touchStartY;

      const duration =
        Date.now() -
        touchStartTime;


      /*
        نتأكد أن الحركة أفقية
        وليست تمريراً عمودياً.
      */

      if(
        Math.abs(dx) < 60 ||
        Math.abs(dx) < Math.abs(dy) * 1.2 ||
        duration > 1000
      ){

        return;

      }


      /*
        RTL:
        سحب من اليمين إلى اليسار
        = الصفحة التالية.
      */

      if(dx < 0){

        if(
          pageNumber <
          PAGES_TOTAL
        ){

          goToMushafPage(
            pageNumber + 1
          );

        }

      }else{

        if(
          pageNumber > 1
        ){

          goToMushafPage(
            pageNumber - 1
          );

        }

      }

    },
    {
      passive:true
    }
  );


  /*
    منع سحب الصورة نفسها.
  */

  image.addEventListener(
    'dragstart',
    e => e.preventDefault()
  );


  /*
    تحديث عنوان الصفحة.
  */

  appTitle.textContent =
    'الصفحة ' +
    toAr(pageNumber);


  /*
    حفظ عند مغادرة الصفحة.
  */

  currentPageNumber =
    pageNumber;

}


/* =====================================================
   GO TO MUSHAF PAGE
===================================================== */

function goToMushafPage(
  pageNumber
){

  if(
    pageNumber < 1 ||
    pageNumber > PAGES_TOTAL
  ){

    return;

  }


  saveLastReadingPage(
    pageNumber
  );


  setSub(
    'الصفحة ' +
    toAr(pageNumber)
  );


  renderMushaf(
    pageNumber
  );


  window.scrollTo(
    0,
    0
  );

}


/* =====================================================
   SURAH READING
===================================================== */

const audioEl =
  new Audio();

let currentAudioQueue = [];

let playIndex = -1;


async function renderSurah(
  number,
  scrollToNum
){

  app.innerHTML =
    '<div class="state-msg">جاري تحميل السورة...</div>';


  try{

    let data =
      surahCache[number];


    if(!data){

      const res =
        await fetch(
          `${API}/surah/${number}/editions/quran-uthmani,ar.muyassar,ar.alafasy`
        );

      const json =
        await res.json();

      data =
        json.data;

      surahCache[number] =
        data;

    }


    const uthmani =
      data[0];

    const tafsir =
      data[1];

    const audio =
      data[2];


    currentView = {

      type:'surah',

      number:uthmani.number,

      name:uthmani.name

    };


    currentAudioQueue =
      audio.ayahs.map(
        a => ({

          id:a.numberInSurah,

          url:a.audio,

          surahName:
            uthmani.name,

          ayahNum:
            a.numberInSurah

        })
      );


    const showBismillah =
      uthmani.number !== 1 &&
      uthmani.number !== 9;


    const reciterId =
      getReciterId();


    const reciterOptionsHtml =
      buildReciterOptionsHtml(
        reciterId
      );


    const isUnavailable =
      !reciterAvailableForSurah(
        reciterId,
        uthmani.number
      );


    let html = `

      <div class="surah-heading">

        <h2>
          ${uthmani.name}
        </h2>

        <div class="meta">
          ${revTypeAr(uthmani.revelationType)}
          ·
          ${toAr(uthmani.numberOfAyahs)}
          آية
        </div>


        <div class="reciter-row">

          <label
            for="reciter-select"
            class="reciter-label">

            القارئ:

          </label>

          <select
            id="reciter-select"
            class="reciter-select">

            ${reciterOptionsHtml}

          </select>

        </div>


        ${
          isUnavailable
          ?
          `
          <div class="reciter-warning">

            هذه السورة غير متوفرة بصوت هذا القارئ حالياً.

          </div>
          `
          :
          ''
        }


        <button
          class="play-surah-btn"
          id="play-surah"
          ${isUnavailable ? 'disabled' : ''}>

          ▶
          الاستماع للسورة كاملة

        </button>

      </div>

    `;


    if(showBismillah){

      html += `

        <div class="bismillah-line">

          بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ

        </div>

      `;

    }


    html +=
      uthmani.ayahs
      .map(
        (a,i) => {

          const qid =
            currentAudioQueue[i].id;

          const tafsirText =
            tafsir.ayahs[i]
            ? tafsir.ayahs[i].text
            : '';


          return `

            <div
              class="ayah-block"
              data-idx="${i}"
              id="ayah-${qid}">

              <p class="ayah-text">

                ${a.text}

                <span class="ayah-marker">
                  ${toAr(a.numberInSurah)}
                </span>

              </p>


              <div class="ayah-tools">

                <button
                  class="tafsir-toggle"
                  data-tid="tafsir-${qid}">

                  التفسير الميسر

                </button>

              </div>


              <div
                class="tafsir-text"
                id="tafsir-${qid}"
                hidden>

                ${tafsirText}

              </div>

            </div>

          `;

        }
      )
      .join('');


    app.innerHTML =
      html;


    document
      .getElementById(
        'reciter-select'
      )
      .addEventListener(
        'change',
        e => {

          setReciterId(
            e.target.value
          );

          stopAudio();

          renderSurah(
            uthmani.number
          );

        }
      );


    const playSurahBtn =
      document.getElementById(
        'play-surah'
      );


    if(playSurahBtn){

      playSurahBtn.addEventListener(
        'click',
        () => {

          const rid =
            getReciterId();

          const r =
            RECITERS[rid];


          if(
            r.mode ===
            'ayah'
          ){

            playFrom(0);

          }else{

            if(
              !reciterAvailableForSurah(
                rid,
                uthmani.number
              )
            ){

              return;

            }

            playSurahFull(
              uthmani.number,
              uthmani.name,
              rid
            );

          }

        }
      );

    }


    app
      .querySelectorAll(
        '.tafsir-toggle'
      )
      .forEach(btn => {

        btn.addEventListener(
          'click',
          e => {

            e.stopPropagation();

            const t =
              document.getElementById(
                btn.getAttribute(
                  'data-tid'
                )
              );

            t.hidden =
              !t.hidden;

          }
        );

      });


    app
      .querySelectorAll(
        '.ayah-block'
      )
      .forEach(block => {

        block.addEventListener(
          'click',
          () => {

            const rid =
              getReciterId();

            if(
              RECITERS[rid].mode ===
              'ayah'
            ){

              const idx =
                Number(
                  block.getAttribute(
                    'data-idx'
                  )
                );

              playFrom(idx);

            }

          }
        );

      });


    if(scrollToNum){

      const target =
        document.getElementById(
          `ayah-${scrollToNum}`
        );

      if(target){

        target.scrollIntoView({
          behavior:'smooth',
          block:'center'
        });

      }

    }


  }catch(err){

    app.innerHTML = `

      <div class="state-msg">

        تعذر تحميل السورة.

        <br><br>

        افتح الموقع في Chrome
        وتأكد من اتصال الإنترنت.

      </div>

    `;

  }

}


/* =====================================================
   RECITER FUNCTIONS
===================================================== */

function getReciterId(){

  try{

    const saved =
      localStorage.getItem(
        RECITER_STORAGE_KEY
      );

    if(
      saved &&
      RECITERS[saved]
    ){

      return saved;

    }

  }catch(e){}

  return 'alafasy';

}


function setReciterId(id){

  try{

    localStorage.setItem(
      RECITER_STORAGE_KEY,
      id
    );

  }catch(e){}

}


function reciterAvailableForSurah(
  reciterId,
  surahNumber
){

  const r =
    RECITERS[reciterId];

  if(
    r.mode !==
    'surah'
  ){

    return true;

  }

  if(
    r.surahs ===
    'all'
  ){

    return true;

  }

  return r.surahs.indexOf(
    surahNumber
  ) !== -1;

}


function surahAudioUrl(
  reciterId,
  surahNumber
){

  const r =
    RECITERS[reciterId];

  return (
    r.server +
    pad3(surahNumber) +
    '.mp3'
  );

}


function buildReciterOptionsHtml(
  reciterId
){

  return Object
    .entries(RECITERS)
    .map(
      ([key,r]) =>

        `
        <option
          value="${key}"
          ${key === reciterId ? 'selected' : ''}>

          ${r.name}

        </option>
        `
    )
    .join('');

}

/* =====================================================
   HADITH GRADE
===================================================== */

function classifyHadithGrade(
  grades
){

  if(
    !grades ||
    !grades.length
  ){

    return null;

  }


  let strong = 0;

  let weak = 0;


  grades.forEach(
    g => {

      const v =
        (g.grade || '')
        .toLowerCase();


      if(
        v.indexOf('daif') !== -1 ||
        v.indexOf('munkar') !== -1 ||
        v.indexOf('mawdu') !== -1 ||
        v.indexOf('matruk') !== -1
      ){

        weak++;

      }else if(
        v.indexOf('sahih') !== -1 ||
        v.indexOf('hasan') !== -1
      ){

        strong++;

      }

    }
  );


  if(
    weak > 0 &&
    strong === 0
  ){

    return 'weak';

  }


  if(
    weak > 0 &&
    strong > 0
  ){

    return 'disputed';

  }


  return null;

}
