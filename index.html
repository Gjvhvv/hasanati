<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حسناتي</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E3B2E">
<link rel="icon" href="icons/icon-192.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap');

:root{
  --ink:#1C1B16;
  --paper:#F6EFDD;
  --paper-2:#EFE6CE;
  --green-deep:#0E3B2E;
  --green-mid:#1F5C46;
  --gold:#B8863E;
  --gold-soft:#EDE0BD;
  --muted:#77694f;
  --line:#ddd0ac;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  padding-bottom:70px;
}

button,input,select{
  font-family:inherit;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:100;
  background:var(--green-deep);
  color:var(--paper);
  border-bottom:3px solid var(--gold);
}

.header-row{
  max-width:720px;
  margin:auto;
  min-height:58px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
}

.icon-btn{
  background:none;
  border:none;
  color:var(--paper);
  cursor:pointer;
  padding:7px;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:active{
  background:rgba(255,255,255,.15);
}

.icon-btn svg{
  width:22px;
  height:22px;
}

.app-title{
  flex:1;
  text-align:center;
  font-family:'Amiri Quran',serif;
  font-size:1.2rem;
  font-weight:700;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:2px;
}

.search-bar-wrap{
  max-width:720px;
  margin:auto;
  padding:0 14px;
  max-height:0;
  overflow:hidden;
  transition:.25s;
}

.search-bar-wrap.open{
  max-height:75px;
  padding:10px 14px;
}

.search-input-row{
  display:flex;
  gap:7px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.25);
  border-radius:9px;
  padding:4px;
}

.search-input-row input{
  flex:1;
  min-width:0;
  border:none;
  outline:none;
  background:none;
  color:white;
  padding:8px;
  font-size:1rem;
}

.search-input-row input::placeholder{
  color:rgba(255,255,255,.6);
}

.search-input-row button{
  background:var(--gold);
  color:var(--green-deep);
  border:none;
  border-radius:7px;
  padding:0 15px;
  font-weight:700;
}

/* ================= MAIN ================= */

main{
  max-width:720px;
  margin:auto;
  padding:20px 16px 40px;
}

.state-msg{
  text-align:center;
  color:var(--muted);
  padding:45px 10px;
  line-height:2;
}

.hero{
  text-align:center;
  padding:20px 8px 25px;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}

.bismillah{
  font-family:'Amiri Quran',serif;
  font-size:2rem;
  color:var(--green-deep);
  margin:0 0 7px;
}

.hero .sub{
  margin:0;
  color:var(--muted);
  font-size:.9rem;
}

/* ================= CONTINUE ================= */

.continue-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--green-deep);
  color:var(--paper);
  border-radius:10px;
  padding:13px 14px;
  margin-bottom:16px;
  cursor:pointer;
}

.continue-text{
  font-size:.92rem;
}

.continue-text strong{
  color:var(--gold);
  font-family:'Amiri Quran',serif;
}

.continue-clear{
  background:none;
  border:none;
  color:white;
  font-size:1rem;
}

/* ================= HOME TABS ================= */

.home-tabs{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}

.home-tab{
  flex:1;
  background:var(--paper-2);
  border:1.5px solid var(--line);
  color:var(--muted);
  border-radius:8px;
  padding:10px 0;
  font-weight:700;
  cursor:pointer;
}

.home-tab.active{
  background:var(--green-deep);
  color:var(--paper);
  border-color:var(--green-deep);
}

/* ================= LIST ================= */

.surah-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:13px 4px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.surah-row:active{
  background:var(--paper-2);
}

.surah-num{
  flex-shrink:0;
  width:35px;
  height:35px;
  border:1.5px solid var(--gold);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green-deep);
  font-weight:700;
}

.surah-info{
  flex:1;
  min-width:0;
}

.surah-name{
  font-family:'Amiri Quran',serif;
  font-size:1.15rem;
}

.surah-meta{
  color:var(--muted);
  font-size:.82rem;
  margin-top:2px;
}

.surah-arrow{
  color:var(--muted);
}

/* ================= READING VIEW ================= */

.reading-view{
  width:100%;
  max-width:720px;
  margin:auto;
}

.reading-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:12px;
}

.reading-btn{
  background:var(--paper-2);
  border:1.5px solid var(--gold);
  color:var(--green-deep);
  border-radius:8px;
  padding:9px 14px;
  font-weight:700;
  cursor:pointer;
}

.reading-btn:disabled{
  opacity:.35;
}

.page-number{
  text-align:center;
  color:var(--muted);
  font-size:.85rem;
  flex:1;
}

.quran-page{
  position:relative;
  width:100%;
  min-height:calc(100vh - 155px);
  background:#fffdf5;
  border:1px solid #cdbf9d;
  border-radius:4px;
  box-shadow:0 2px 12px rgba(0,0,0,.12);
  padding:30px 20px 35px;
  touch-action:pan-y;
  user-select:none;
  overflow:hidden;
}

.quran-page-inner{
  min-height:calc(100vh - 230px);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.page-header{
  text-align:center;
  color:var(--green-deep);
  font-family:'Amiri Quran',serif;
  font-size:1.25rem;
  margin-bottom:18px;
}

.page-bismillah{
  text-align:center;
  font-family:'Amiri Quran',serif;
  font-size:1.6rem;
  color:var(--green-deep);
  margin:5px 0 20px;
}

.page-ayah{
  font-family:'Amiri Quran',serif;
  font-size:1.55rem;
  line-height:2.45;
  text-align:right;
  margin:0;
  color:#17150f;
}

.ayah-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:29px;
  height:29px;
  border:1.4px solid var(--gold);
  border-radius:50%;
  font-family:'Tajawal',sans-serif;
  font-size:.78rem;
  color:var(--green-deep);
  vertical-align:middle;
  margin:0 3px;
}

.page-footer{
  text-align:center;
  color:var(--muted);
  font-size:.78rem;
  margin-top:22px;
  padding-top:12px;
  border-top:1px solid var(--line);
}

/* ================= SWIPE HINT ================= */

.swipe-hint{
  text-align:center;
  color:var(--muted);
  font-size:.78rem;
  padding:10px 0 3px;
}

/* ================= SEARCH ================= */

.search-result{
  padding:14px 4px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.search-result .ref{
  color:var(--gold);
  font-size:.8rem;
  font-weight:700;
  margin-bottom:5px;
}

.search-result .txt{
  font-family:'Amiri Quran',serif;
  font-size:1.25rem;
  line-height:2;
}

mark{
  background:var(--gold-soft);
}

/* ================= HADITH ================= */

.hadith-nav{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.hadith-jump{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.hadith-jump input{
  flex:1;
  min-width:0;
  border:1.5px solid var(--gold);
  border-radius:8px;
  padding:9px;
  background:var(--paper-2);
  outline:none;
}

.hadith-jump button{
  background:var(--gold);
  color:var(--green-deep);
  border:none;
  border-radius:8px;
  padding:0 16px;
  font-weight:700;
}

.hadith-text{
  font-family:'Amiri Quran',serif;
  font-size:1.3rem;
  line-height:2.3;
}

.hadith-source{
  background:var(--paper-2);
  border-radius:8px;
  padding:13px;
  color:var(--muted);
  line-height:1.9;
}

.hadith-source strong{
  color:var(--green-deep);
}

/* ================= AUDIO ================= */

#audio-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:200;
  background:var(--green-deep);
  color:var(--paper);
  border-top:3px solid var(--gold);
  display:none;
  align-items:center;
  gap:12px;
  padding:9px 14px;
}

#audio-bar.show{
  display:flex;
}

.audio-info{
  flex:1;
  min-width:0;
}

.audio-name{
  font-family:'Amiri Quran',serif;
  font-size:1rem;
}

.audio-num{
  color:var(--gold);
  font-size:.78rem;
}

/* ================= TOAST ================= */

#toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%) translateY(20px);
  background:var(--green-deep);
  color:var(--paper);
  border:1px solid var(--gold);
  border-radius:20px;
  padding:9px 17px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:300;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  main{
    padding:14px 10px 30px;
  }

  .quran-page{
    min-height:calc(100vh - 125px);
    border-radius:2px;
    padding:22px 14px 25px;
  }

  .quran-page-inner{
    min-height:calc(100vh - 200px);
  }

  .page-ayah{
    font-size:1.32rem;
    line-height:2.25;
  }

  .page-bismillah{
    font-size:1.4rem;
  }

  .page-header{
    font-size:1.1rem;
  }

  .ayah-number{
    width:26px;
    height:26px;
    font-size:.7rem;
  }
}

@media(max-width:380px){

  .page-ayah{
    font-size:1.2rem;
    line-height:2.15;
  }

  .quran-page{
    padding-left:11px;
    padding-right:11px;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-row">

    <button id="back-btn" class="icon-btn" style="display:none" aria-label="رجوع">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    </button>

    <div class="app-title" id="app-title">حسناتي</div>

    <div class="header-actions">

      <button id="bookmark-btn" class="icon-btn" style="display:none" aria-label="حفظ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 4h12v16l-6-4-6 4V4z"/>
        </svg>
      </button>

      <button id="search-btn" class="icon-btn" aria-label="بحث">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.3-4.3"/>
        </svg>
      </button>

    </div>
  </div>

  <div class="search-bar-wrap" id="search-wrap">

    <div class="search-input-row">

      <input
        id="search-input"
        type="text"
        placeholder="ابحث في آيات القرآن الكريم..."
      >

      <button id="search-go">بحث</button>

    </div>

  </div>

</header>

<main id="app">

  <div class="state-msg">
    جاري التحميل...
  </div>

</main>

<div id="audio-bar">

  <button id="audio-toggle" class="icon-btn">
    <svg id="audio-icon" viewBox="0 0 24 24" fill="currentColor">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>

  <div class="audio-info">
    <div class="audio-name" id="audio-name"></div>
    <div class="audio-num" id="audio-num"></div>
  </div>

  <button id="audio-stop" class="icon-btn">
    ✕
  </button>

</div>

<div id="toast"></div>


<script>

(function(){

"use strict";

/* =========================================================
   إعدادات التطبيق
========================================================= */

const API = "https://api.alquran.cloud/v1";

const TOTAL_PAGES = 604;

const BOOKMARK_KEY = "hasanati_bookmark";
const READING_PAGE_KEY = "hasanati_last_quran_page";


/* =========================================================
   عناصر الصفحة
========================================================= */

const app = document.getElementById("app");

const appTitle = document.getElementById("app-title");

const backBtn = document.getElementById("back-btn");

const bookmarkBtn = document.getElementById("bookmark-btn");

const searchBtn = document.getElementById("search-btn");

const searchWrap = document.getElementById("search-wrap");

const searchInput = document.getElementById("search-input");

const searchGo = document.getElementById("search-go");

const toast = document.getElementById("toast");


/* =========================================================
   الحالة
========================================================= */

let surahList = null;

let surahCache = {};

let currentView = null;

let currentHomeTab = "surahs";

let currentReadingPage = 1;

let pageLoading = false;


/* =========================================================
   الأحاديث
========================================================= */

const HADITH_API =
"https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1";

const HADITH_BOOKS = {

  bukhari:{
    name:"صحيح البخاري",
    author:"الإمام محمد بن إسماعيل البخاري",
    max:7563
  },

  muslim:{
    name:"صحيح مسلم",
    author:"الإمام مسلم بن الحجاج النيسابوري",
    max:7563
  },

  abudawud:{
    name:"سنن أبي داود",
    author:"الإمام أبو داود السجستاني",
    max:5274
  },

  tirmidhi:{
    name:"جامع الترمذي",
    author:"الإمام أبو عيسى الترمذي",
    max:3956
  },

  nasai:{
    name:"سنن النسائي",
    author:"الإمام أحمد بن شعيب النسائي",
    max:5758
  },

  ibnmajah:{
    name:"سنن ابن ماجه",
    author:"الإمام محمد بن يزيد ابن ماجه",
    max:4341
  },

  malik:{
    name:"موطأ الإمام مالك",
    author:"الإمام مالك بن أنس",
    max:1858
  },

  nawawi:{
    name:"الأربعون النووية",
    author:"الإمام يحيى بن شرف النووي",
    max:42
  }

};

const HADITH_ORDER = [
  "bukhari",
  "muslim",
  "abudawud",
  "tirmidhi",
  "nasai",
  "ibnmajah",
  "malik",
  "nawawi"
];

let hadithCache = {};


/* =========================================================
   أدوات
========================================================= */

const arabicNumbers =
["٠","١","٢","٣","٤","٥","٦","٧","٨","٩"];

function toAr(number){

  return String(number).replace(
    /[0-9]/g,
    n => arabicNumbers[n]
  );

}


function revelationType(type){

  return type === "Meccan"
    ? "مكية"
    : "مدنية";

}


function showToast(message){

  toast.textContent = message;

  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(
      () => toast.classList.remove("show"),
      1800
    );

}


/* =========================================================
   الحفظ
========================================================= */

function saveLastPage(page){

  try{

    localStorage.setItem(
      READING_PAGE_KEY,
      String(page)
    );

  }catch(e){}

}


function getLastPage(){

  try{

    const value =
      Number(
        localStorage.getItem(
          READING_PAGE_KEY
        )
      );

    if(value >= 1 && value <= TOTAL_PAGES){

      return value;

    }

  }catch(e){}

  return 1;

}


function saveBookmark(data){

  try{

    localStorage.setItem(
      BOOKMARK_KEY,
      JSON.stringify(data)
    );

  }catch(e){}

}


function getBookmark(){

  try{

    const value =
      localStorage.getItem(BOOKMARK_KEY);

    return value
      ? JSON.parse(value)
      : null;

  }catch(e){

    return null;

  }

}


/* =========================================================
   Header
========================================================= */

function homeHeader(){

  backBtn.style.display = "none";

  bookmarkBtn.style.display = "none";

  appTitle.textContent = "حسناتي";

}


function subHeader(title){

  backBtn.style.display = "flex";

  bookmarkBtn.style.display = "flex";

  appTitle.textContent = title;

}


/* =========================================================
   الرجوع
========================================================= */

backBtn.addEventListener(
  "click",
  () => {

    stopAudio();

    currentView = null;

    renderHome();

  }
);


/* =========================================================
   البحث
========================================================= */

searchBtn.addEventListener(
  "click",
  () => {

    searchWrap.classList.toggle("open");

    if(searchWrap.classList.contains("open")){

      setTimeout(
        () => searchInput.focus(),
        100
      );

    }

  }
);


searchGo.addEventListener(
  "click",
  doSearch
);


searchInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      doSearch();

    }

  }
);


async function doSearch(){

  const query =
    searchInput.value.trim();

  if(!query) return;

  subHeader("نتائج البحث");

  searchWrap.classList.remove("open");

  app.innerHTML =
    `<div class="state-msg">جاري البحث...</div>`;

  try{

    const response =
      await fetch(
        `${API}/search/${encodeURIComponent(query)}/all/ar`
      );

    if(!response.ok){

      throw new Error("search");

    }

    const json =
      await response.json();

    const matches =
      json.data &&
      json.data.matches
        ? json.data.matches
        : [];

    if(!matches.length){

      app.innerHTML =
        `<div class="state-msg">
          لم يتم العثور على نتائج.
        </div>`;

      return;

    }

    const escaped =
      query.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );

    const regex =
      new RegExp(escaped,"gi");

    app.innerHTML =
      `<div style="color:var(--muted);margin-bottom:12px">
        ${toAr(matches.length)} نتيجة
      </div>` +

      matches.map(
        item => {

          const text =
            item.text.replace(
              regex,
              match =>
                `<mark>${match}</mark>`
            );

          return `
            <div
              class="search-result"
              data-surah="${item.surah.number}"
              data-ayah="${item.numberInSurah}"
            >

              <div class="ref">
                ${item.surah.name}
                — آية ${toAr(item.numberInSurah)}
              </div>

              <div class="txt">
                ${text}
              </div>

            </div>
          `;

        }
      ).join("");


    document
      .querySelectorAll(".search-result")
      .forEach(
        element => {

          element.addEventListener(
            "click",
            () => {

              const surah =
                Number(
                  element.dataset.surah
                );

              const ayah =
                Number(
                  element.dataset.ayah
                );

              subHeader("السورة");

              renderSurah(
                surah,
                ayah
              );

            }
          );

        }
      );

  }catch(error){

    app.innerHTML =
      `<div class="state-msg">
        تعذر إتمام البحث.<br>
        تأكد من اتصال الإنترنت ثم حاول مرة أخرى.
      </div>`;

  }

}


/* =========================================================
   الصفحة الرئيسية
========================================================= */

function renderHome(){

  homeHeader();

  const bookmark =
    getBookmark();

  app.innerHTML = `

    <div class="hero">

      <p class="bismillah">
        بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
      </p>

      <p class="sub">
        ١١٤ سورة · ٦٠٤ صفحة
      </p>

    </div>

    ${
      bookmark
      ?
      `
      <div
        class="continue-card"
        id="continue-card"
      >

        <div class="continue-text">
          📖 متابعة القراءة:
          <strong>
            ${bookmark.label}
          </strong>
        </div>

        <button
          class="continue-clear"
          id="continue-clear"
        >
          ✕
        </button>

      </div>
      `
      :
      ""
    }

    <div class="home-tabs">

      <button
        class="home-tab
        ${currentHomeTab === "surahs" ? "active" : ""}"
        data-tab="surahs"
      >
        السور

async function renderQuranPage(page){

  if(pageLoading) return;

  pageLoading = true;

  currentReadingPage = page;

  saveLastPage(page);

  saveBookmark({

    type:"reading",

    page:page,

    label:
      "الصفحة " + toAr(page)

  });

  app.innerHTML = `

    <div class="reading-view">

      <div class="reading-toolbar">

        <button
          class="reading-btn"
          id="prev-page"
          ${page <= 1 ? "disabled" : ""}
        >
          ‹ السابقة
        </button>

        <div class="page-number">
          صفحة
          ${toAr(page)}
          /
          ${toAr(TOTAL_PAGES)}
        </div>

        <button
          class="reading-btn"
          id="next-page"
          ${page >= TOTAL_PAGES ? "disabled" : ""}
        >
          التالية ›
        </button>

      </div>

      <div
        class="quran-page"
        id="quran-page"
      >

        <div class="quran-page-inner">

          <div class="state-msg">
            جاري تحميل صفحة المصحف...
          </div>

        </div>

      </div>

      <div class="swipe-hint">
        اسحب ← للتالية &nbsp; | &nbsp; اسحب → للسابقة
      </div>

    </div>

  `;


  const prev =
    document.getElementById(
      "prev-page"
    );

  const next =
    document.getElementById(
      "next-page"
    );


  prev.addEventListener(
    "click",
    () => {

      if(page > 1){

        renderQuranPage(
          page - 1
        );

      }

    }
  );


  next.addEventListener(
    "click",
    () => {

      if(page < TOTAL_PAGES){

        renderQuranPage(
          page + 1
        );

      }

    }
  );


  /* السحب بالإصبع */

  setupSwipe(
    document.getElementById(
      "quran-page"
    ),
    page
  );


  try{

    /*
      نستخدم API صفحة واحدة فقط.
      هذا أسرع وأبسط من تحميل السورة
      كاملة.
    */

    const response =
      await fetch(
        `${API}/page/${page}/quran-uthmani`
      );

    if(!response.ok){

      throw new Error(
        "API error"
      );

    }

    const json =
      await response.json();

    if(
      !json.data ||
      !json.data.ayahs
    ){

      throw new Error(
        "No page data"
      );

    }


    const ayahs =
      json.data.ayahs;


    let html = "";

    let lastSurah = null;


    ayahs.forEach(
      ayah => {

        if(
          !lastSurah ||
          lastSurah.number !==
          ayah.surah.number
        ){

          lastSurah =
            ayah.surah;

          html += `

            <div class="page-header">
              ${ayah.surah.name}
            </div>

          `;


          if(
            ayah.numberInSurah === 1 &&
            ayah.surah.number !== 1 &&
            ayah.surah.number !== 9
          ){

            html += `

              <div class="page-bismillah">
                بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
              </div>

            `;

          }

        }


        html += `

          <span>
            ${ayah.text}
          </span>

          <span class="ayah-number">
            ${toAr(ayah.numberInSurah)}
          </span>

        `;

      }
    );


    html += `

      <div class="page-footer">
        ${toAr(page)}
      </div>

    `;


    const inner =
      document.querySelector(
        ".quran-page-inner"
      );

    if(inner){

      inner.innerHTML = `
        <div class="page-ayah">
          ${html}
        </div>
      `;

    }


    /*
      تحديث العنوان
    */

    appTitle.textContent =
      "قراءة — الصفحة " +
      toAr(page);


  }catch(error){

    const inner =
      document.querySelector(
        ".quran-page-inner"
      );

    if(inner){

      inner.innerHTML = `

        <div class="state-msg">

          <div style="font-size:2rem">
            ⚠️
          </div>

          <br>

          تعذر تحميل صفحة القرآن.

          <br><br>

          تأكد من اتصال الهاتف بالإنترنت
          ثم اضغط على زر المحاولة.

          <br><br>

          <button
            class="reading-btn"
            id="retry-page"
          >
            إعادة المحاولة
          </button>

        </div>

      `;


      document
        .getElementById("retry-page")
        .addEventListener(
          "click",
          () => {

            pageLoading = false;

            renderQuranPage(page);

          }
        );

    }

  }


  pageLoading = false;

}


/* =========================================================
   Swipe
========================================================= */

function setupSwipe(element,page){

  let startX = 0;

  let startY = 0;

  let startTime = 0;


  element.addEventListener(
    "touchstart",
    event => {

      const touch =
        event.changedTouches[0];

      startX =
        touch.clientX;

      startY =
        touch.clientY;

      startTime =
        Date.now();

    },
    {passive:true}
  );


  element.addEventListener(
    "touchend",
    event => {

      const touch =
        event.changedTouches[0];

      const endX =
        touch.clientX;

      const endY =
        touch.clientY;

      const dx =
        endX - startX;

      const dy =
        endY - startY;

      const duration =
        Date.now() - startTime;


      /*
        يجب أن تكون الحركة أفقية
        وليست مجرد تمرير رأسي.
      */

      if(
        Math.abs(dx) < 55 ||
        Math.abs(dx) < Math.abs(dy) ||
        duration > 1000
      ){

        return;

      }


      /*
        RTL:

        سحب لليسار = الصفحة التالية
        سحب لليمين = الصفحة السابقة
      */

      if(dx < 0){

        if(page < TOTAL_PAGES){

          renderQuranPage(
            page + 1
          );

        }else{

          showToast(
            "هذه آخر صفحة في المصحف"
          );

        }

      }else{

        if(page > 1){

          renderQuranPage(
            page - 1
          );

        }else{

          showToast(
            "هذه أول صفحة في المصحف"
          );

        }

      }

    },
    {passive:true}
  );

}

async function renderHadith(
  bookKey,
  number
){

  const book =
    HADITH_BOOKS[bookKey];


  app.innerHTML =
    `<div class="state-msg">
      جاري تحميل الحديث...
    </div>`;


  try{

    const cacheKey =
      bookKey +
      ":" +
      number;


    let hadith =
      hadithCache[cacheKey];


    if(!hadith){

      const response =
        await fetch(
          `${HADITH_API}/editions/ara-${bookKey}/${number}.min.json`
        );


      if(!response.ok){

        throw new Error(
          "hadith"
        );

      }


      const json =
        await response.json();


      if(
        !json.hadiths ||
        !json.hadiths.length
      ){

        throw new Error(
          "empty"
        );

      }


      hadith =
        json.hadiths[0];


      hadithCache[cacheKey] =
        hadith;

    }


    currentView = {

      type:"hadith",

      book:bookKey,

      number:number,

      name:book.name

    };


    app.innerHTML = `

      <div class="hadith-nav">

        <button
          class="reading-btn"
          id="hadith-prev"
          ${number <= 1 ? "disabled" : ""}
        >
          ‹ السابق
        </button>

        <div class="page-number">
          حديث ${toAr(number)}
        </div>

        <button
          class="reading-btn"
          id="hadith-next"
        >
          التالي ›
        </button>

      </div>


      <div class="hadith-jump">

        <input
          type="number"
          id="hadith-number"
          min="1"
          placeholder="رقم الحديث"
        >

        <button id="hadith-go">
          اذهب
        </button>

      </div>


      <div class="hadith-text">

        ${hadith.text}

      </div>


      <div class="hadith-source">

        <strong>
          ${book.name}
        </strong>

        <br>

        ${book.author}

        <br>

        الحديث رقم
        ${toAr(number)}

      </div>

    `;


    document
      .getElementById(
        "hadith-prev"
      )
      .addEventListener(
        "click",
        () => {

          if(number > 1){

            renderHadith(
              bookKey,
              number - 1
            );

          }

        }
      );


    document
      .getElementById(
        "hadith-next"
      )
      .addEventListener(
        "click",
        () => {

          renderHadith(
            bookKey,
            number + 1
          );

        }
      );


    const input =
      document.getElementById(
        "hadith-number"
      );


    const go =
      document.getElementById(
        "hadith-go"
      );


    function jump(){

      const value =
        Number(input.value);

      if(
        value >= 1
      ){

        renderHadith(
          bookKey,
          value
        );

      }

    }


    go.addEventListener(
      "click",
      jump
    );


    input.addEventListener(
      "keydown",
      event => {

        if(
          event.key === "Enter"
        ){

          jump();

        }

      }
    );


  }catch(error){

    app.innerHTML = `

      <div class="state-msg">

        تعذر تحميل هذا الحديث.

        <br><br>

        قد يكون الرقم غير موجود
        في هذه المجموعة.

        <br><br>

        <button
          class="reading-btn"
          id="retry-hadith"
        >
          إعادة المحاولة
        </button>

      </div>

    `;


    document
      .getElementById(
        "retry-hadith"
      )
      .addEventListener(
        "click",
        () =>
          renderHadith(
            bookKey,
            number
          )
      );

  }

}

      <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
    `
    :
    `
      <path d="M8 5v14l11-7z"/>
    `;

}


audio.addEventListener(
  "play",
  () =>
    setPlayIcon(true)
);


audio.addEventListener(
  "pause",
  () =>
    setPlayIcon(false)
);


audioToggle.addEventListener(
  "click",
  () => {

    if(audio.paused){

      audio.play().catch(
        () => {}
      );

    }else{

      audio.pause();

    }

  }
);


audioStop.addEventListener(
  "click",
  () => {

    audio.pause();

    audio.removeAttribute(
      "src"
    );

    audioBar.classList.remove(
      "show"
    );

  }
);


function stopAudio(){

  audio.pause();

  audio.removeAttribute(
    "src"
  );

  audioBar.classList.remove(
    "show"
  );

}
