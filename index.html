<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حسناتي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E3B2E">
<link rel="icon" href="icons/icon-192.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap');

:root{
  --ink:#1C1B16;
  --paper:#F6EFDD;
  --paper-2:#EFE6CE;
  --green-deep:#0E3B2E;
  --green-mid:#1F5C46;
  --gold:#B8863E;
  --gold-soft:#EDE0BD;
  --muted:#77694f;
  --line:#ddd0ac;
}

*{box-sizing:border-box;}

html,body{
  margin:0;
  padding:0;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
  padding-bottom:70px;
}

a,button,input,select{
  font-family:inherit;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--green-deep);
  color:var(--paper);
  border-bottom:3px solid var(--gold);
}

.header-row{
  max-width:720px;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:2px;
  flex-shrink:0;
}

.icon-btn{
  background:none;
  border:none;
  color:var(--paper);
  cursor:pointer;
  padding:6px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.icon-btn:hover{
  background:rgba(255,255,255,.1);
}

.icon-btn svg{
  width:22px;
  height:22px;
}

.app-title{
  flex:1;
  text-align:center;
  font-size:1.15rem;
  font-weight:700;
  font-family:'Amiri Quran',serif;
  letter-spacing:.5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.search-bar-wrap{
  max-width:720px;
  margin:0 auto;
  padding:0 16px;
  overflow:hidden;
  max-height:0;
  transition:max-height .25s ease,padding .25s ease;
}

.search-bar-wrap.open{
  max-height:70px;
  padding:10px 16px;
}

.search-input-row{
  display:flex;
  gap:8px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.25);
  border-radius:8px;
  padding:4px;
}

.search-input-row input{
  flex:1;
  background:none;
  border:none;
  outline:none;
  color:var(--paper);
  font-size:1rem;
  padding:8px 10px;
}

.search-input-row input::placeholder{
  color:rgba(255,255,255,.55);
}

.search-input-row button{
  background:var(--gold);
  border:none;
  color:var(--green-deep);
  font-weight:700;
  border-radius:6px;
  padding:0 16px;
  cursor:pointer;
}

/* ================= MAIN ================= */

main{
  max-width:720px;
  margin:0 auto;
  padding:20px 16px 40px;
}

.state-msg{
  text-align:center;
  color:var(--muted);
  padding:40px 10px;
  font-size:.95rem;
}

/* ================= HOME ================= */

.hero{
  text-align:center;
  padding:18px 10px 26px;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}

.hero .bismillah{
  font-family:'Amiri Quran',serif;
  font-size:2rem;
  color:var(--green-deep);
  margin:0 0 6px;
}

.hero .sub{
  color:var(--muted);
  font-size:.9rem;
  margin:0;
}

.continue-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--green-deep);
  color:var(--paper);
  border-radius:10px;
  padding:12px 14px;
  margin-bottom:16px;
  cursor:pointer;
}

.continue-text{
  font-size:.92rem;
}

.continue-text strong{
  font-family:'Amiri Quran',serif;
  font-size:1.05rem;
  color:var(--gold);
}

.continue-clear{
  background:none;
  border:none;
  color:var(--paper);
  opacity:.75;
  font-size:1rem;
  cursor:pointer;
  padding:2px 6px;
  flex-shrink:0;
}

.continue-clear:hover{
  opacity:1;
}

.home-tabs{
  display:flex;
  gap:8px;
  margin-bottom:14px;
}

.home-tab{
  flex:1;
  background:var(--paper-2);
  border:1.5px solid var(--line);
  color:var(--muted);
  border-radius:8px;
  padding:9px 0;
  font-weight:700;
  font-size:.92rem;
  cursor:pointer;
}

.home-tab.active{
  background:var(--green-deep);
  color:var(--paper);
  border-color:var(--green-deep);
}

.surah-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:13px 4px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.surah-row:hover{
  background:var(--paper-2);
}

.surah-num{
  flex-shrink:0;
  width:34px;
  height:34px;
  border:1.5px solid var(--gold);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green-deep);
  font-weight:700;
  font-size:.9rem;
}

.surah-info{
  flex:1;
  min-width:0;
}

.surah-name{
  font-family:'Amiri Quran',serif;
  font-size:1.15rem;
  color:var(--ink);
}

.surah-meta{
  color:var(--muted);
  font-size:.82rem;
  margin-top:2px;
}

.surah-arrow{
  color:var(--muted);
  flex-shrink:0;
}

.surah-arrow svg{
  width:16px;
  height:16px;
}

/* ================= MUSHAF READER ================= */

.mushaf-reader{
  width:100%;
  min-height:calc(100vh - 90px);
  display:flex;
  flex-direction:column;
  align-items:center;
}

.mushaf-top{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:8px 0 12px;
  position:sticky;
  top:0;
  z-index:10;
  background:var(--paper);
}

.mushaf-nav{
  background:var(--paper-2);
  border:1.5px solid var(--gold);
  color:var(--green-deep);
  border-radius:8px;
  padding:8px 12px;
  font-weight:700;
  font-size:.82rem;
  cursor:pointer;
  white-space:nowrap;
}

.mushaf-nav:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.mushaf-page-number{
  flex:1;
  text-align:center;
  color:var(--muted);
  font-size:.82rem;
  font-weight:700;
}

.mushaf-image-container{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  overflow:hidden;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
}

#mushaf-page-image{
  display:block;
  width:100%;
  max-width:720px;
  height:auto;
  object-fit:contain;
  user-select:none;
  -webkit-user-drag:none;
  -webkit-user-select:none;
}

.mushaf-bottom{
  width:100%;
  display:flex;
  justify-content:center;
  padding:14px 0 20px;
}

.mushaf-save{
  background:var(--green-deep);
  color:var(--paper);
  border:none;
  border-radius:8px;
  padding:10px 22px;
  font-weight:700;
  cursor:pointer;
}

@media(max-width:600px){

  main{
    padding-left:0;
    padding-right:0;
  }

  .hero,
  .home-tabs,
  .continue-card,
  #home-list:not(.mushaf-reader){
    margin-left:16px;
    margin-right:16px;
  }

  .mushaf-reader{
    width:100%;
  }

  .mushaf-top{
    padding:8px 10px 10px;
  }

  #mushaf-page-image{
    width:100%;
    max-width:none;
  }

  .mushaf-nav{
    padding:7px 9px;
    font-size:.78rem;
  }
}

/* ================= READING VIEW ================= */

.surah-heading{
  text-align:center;
  padding:6px 0 20px;
}

.surah-heading h2{
  font-family:'Amiri Quran',serif;
  font-size:1.7rem;
  color:var(--green-deep);
  margin:0 0 6px;
}

.surah-heading .meta{
  color:var(--muted);
  font-size:.85rem;
}

.reciter-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin:14px 0 4px;
  flex-wrap:wrap;
}

.reciter-label{
  color:var(--muted);
  font-size:.85rem;
}

.reciter-select{
  background:var(--paper-2);
  color:var(--ink);
  border:1.5px solid var(--gold);
  border-radius:8px;
  padding:6px 10px;
  font-size:.88rem;
  cursor:pointer;
}

.reciter-warning{
  text-align:center;
  color:#8a3b2b;
  font-size:.8rem;
  margin:6px auto 14px;
  max-width:340px;
}

.ayah-block{
  padding:16px 10px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  transition:background .2s ease;
}

.ayah-block.playing{
  background:var(--gold-soft);
}

.ayah-text{
  font-family:'Amiri Quran',serif;
  font-size:1.55rem;
  line-height:2.5;
  margin:0;
  text-align:right;
}

.ayah-marker{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:30px;
  height:30px;
  margin:0 4px;
  border:1.5px solid var(--gold);
  border-radius:50%;
  font-size:.85rem;
  color:var(--green-deep);
  vertical-align:middle;
}

.ayah-tools{
  display:flex;
  gap:10px;
  margin-top:6px;
}

.tafsir-toggle{
  background:none;
  border:none;
  color:var(--green-mid);
  font-size:.85rem;
  font-weight:700;
  cursor:pointer;
  padding:4px 2px;
  border-bottom:1px dashed var(--green-mid);
}

.tafsir-text{
  margin-top:10px;
  padding:10px 12px;
  background:var(--paper-2);
  border-radius:6px;
  color:var(--ink);
  font-size:.92rem;
  line-height:1.9;
}

.play-surah-btn{
  display:flex;
  align-items:center;
  gap:8px;
  justify-content:center;
  margin:0 auto 14px;
  background:var(--green-deep);
  color:var(--paper);
  border:none;
  border-radius:8px;
  padding:10px 22px;
  font-size:.95rem;
  font-weight:700;
  cursor:pointer;
}

.play-surah-btn:disabled{
  background:#9c9686;
  cursor:not-allowed;
}

.play-surah-btn svg{
  width:18px;
  height:18px;
}

.bismillah-line{
  text-align:center;
  font-family:'Amiri Quran',serif;
  font-size:1.6rem;
  color:var(--green-deep);
  margin:8px 0 26px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}

/* ================= HADITH ================= */

.hadith-nav-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:6px 0 18px;
  gap:10px;
}

.hadith-jump-row{
  display:flex;
  gap:8px;
  margin:0 0 18px;
}

.hadith-jump-row input{
  flex:1;
  border:1.5px solid var(--gold);
  border-radius:8px;
  padding:9px 10px;
  font-size:.95rem;
  background:var(--paper-2);
  color:var(--ink);
}

.hadith-jump-row button{
  background:var(--gold);
  border:none;
  color:var(--green-deep);
  font-weight:700;
  border-radius:8px;
  padding:0 18px;
  cursor:pointer;
}

.page-nav-btn{
  background:var(--paper-2);
  border:1.5px solid var(--gold);
  color:var(--green-deep);
  border-radius:8px;
  padding:9px 14px;
  font-weight:700;
  font-size:.85rem;
  cursor:pointer;
}

.page-nav-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.page-current{
  color:var(--muted);
  font-size:.82rem;
  text-align:center;
}

.grade-banner{
  display:flex;
  align-items:center;
  gap:8px;
  border-radius:8px;
  padding:11px 14px;
  margin-bottom:18px;
  font-size:.92rem;
  font-weight:700;
  line-height:1.6;
}

.grade-banner.weak{
  background:#f6dcd6;
  color:#7a2416;
  border:1.5px solid #b3543c;
}

.grade-banner.disputed{
  background:#f8ecd0;
  color:#7a5a10;
  border:1.5px solid #b8863e;
}

.hadith-card{
  padding:6px 4px 22px;
}

.hadith-text{
  font-family:'Amiri Quran',serif;
  font-size:1.3rem;
  line-height:2.3;
  margin:0 0 18px;
  text-align:right;
}

.hadith-source{
  background:var(--paper-2);
  border-radius:8px;
  padding:12px 14px;
  color:var(--muted);
  font-size:.86rem;
  line-height:1.9;
}

.hadith-source strong{
  color:var(--green-deep);
}

.hadith-source .src-name{
  font-family:'Amiri Quran',serif;
  font-size:1rem;
  color:var(--green-deep);
}

.hadith-num-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:30px;
  height:30px;
  padding:0 6px;
  margin:0 4px;
  border:1.5px solid var(--gold);
  border-radius:50%;
  font-size:.85rem;
  color:var(--green-deep);
  vertical-align:middle;
}

/* ================= SEARCH ================= */

.search-result{
  padding:14px 4px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.search-result:hover{
  background:var(--paper-2);
}

.search-result .ref{
  color:var(--gold);
  font-size:.8rem;
  font-weight:700;
  margin-bottom:6px;
}

.search-result .txt{
  font-family:'Amiri Quran',serif;
  font-size:1.25rem;
  line-height:2;
}

mark{
  background:var(--gold-soft);
  color:var(--ink);
  padding:0 2px;
  border-radius:3px;
}

/* ================= AUDIO ================= */

#audio-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:30;
  background:var(--green-deep);
  color:var(--paper);
  border-top:3px solid var(--gold);
  display:none;
  align-items:center;
  gap:14px;
  padding:10px 16px;
}

#audio-bar.show{
  display:flex;
}

.audio-info{
  flex:1;
  min-width:0;
  font-size:.9rem;
}

.audio-info .s-name{
  font-family:'Amiri Quran',serif;
  font-size:1.05rem;
}

.audio-info .a-num{
  color:var(--gold);
  font-size:.8rem;
}

/* ================= TOAST ================= */

#toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--green-deep);
  color:var(--paper);
  padding:10px 18px;
  border-radius:20px;
  font-size:.88rem;
  opacity:0;
  pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;
  z-index:40;
  border:1px solid var(--gold);
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:420px){
  .ayah-text{
    font-size:1.35rem;
    line-height:2.3;
  }

  .hero .bismillah{
    font-size:1.6rem;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-row">

    <button class="icon-btn"
            id="back-btn"
            style="display:none"
            aria-label="رجوع">

      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2">
        <path d="M15 6l-6 6 6 6"/>
      </svg>

    </button>

    <div class="app-title" id="app-title">
      حسناتي
    </div>

    <div class="header-actions">

      <button class="icon-btn"
              id="bookmark-btn"
              style="display:none"
              aria-label="حفظ مكاني">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">
          <path d="M6 4h12v16l-6-4-6 4V4z"/>
        </svg>

      </button>

      <button class="icon-btn"
              id="search-btn"
              aria-label="بحث">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">

          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.3-4.3"/>

        </svg>

      </button>

    </div>
  </div>

  <div class="search-bar-wrap" id="search-wrap">

    <div class="search-input-row">

      <input
        type="text"
        id="search-input"
        placeholder="ابحث في آيات القرآن الكريم..."
      >

      <button id="search-go">
        بحث
      </button>

    </div>

  </div>
</header>

<main id="app">

  <div class="state-msg">
    جاري التحميل...
  </div>

</main>

<div id="audio-bar">

  <button class="icon-btn"
          id="audio-toggle"
          aria-label="تشغيل / إيقاف">

    <svg id="audio-icon"
         viewBox="0 0 24 24"
         fill="currentColor">

      <path d="M8 5v14l11-7z"/>

    </svg>

  </button>

  <div class="audio-info">

    <div class="s-name"
         id="audio-surah-name">
    </div>

    <div class="a-num"
         id="audio-ayah-num">
    </div>

  </div>

  <button class="icon-btn"
          id="audio-stop"
          aria-label="إيقاف">

    <svg viewBox="0 0 24 24"
         fill="none"
         stroke="currentColor"
         stroke-width="2">

      <path d="M6 6l12 12M18 6L6 18"/>

    </svg>

  </button>

</div>

<div id="toast"></div>

<script>

(function(){

  let currentHadithBook = null;

  /* ================= RECITERS ================= */

  const RECITERS = {

    },

    salman:{

  function reciterAvailableForSurah(
    reciterId,
    surahNumber
  ){

    const r =
      RECITERS[reciterId];

    if(r.mode !== 'surah')
      return true;

    if(r.surahs === 'all')
      return true;

    return r.surahs.indexOf(
      surahNumber
    ) !== -1;
  }

  function renderMushafReaderInto(
    container,
    forcedPage
  ){

    let page =
      Number(forcedPage) || 1;

    if(
      page < 1 ||
      page > PAGES_TOTAL
    ){
      page = 1;
    }

    container.innerHTML = `

      <div
        class="mushaf-reader"
        id="mushaf-reader"
      >

        <div class="mushaf-top">

          <button
            class="mushaf-nav"
            id="mushaf-prev"
          >
            ‹ السابقة
          </button>

          <div
            class="mushaf-page-number"
            id="mushaf-page-number"
          >
            الصفحة ${toAr(page)}
            /
            ${toAr(PAGES_TOTAL)}
          </div>

          <button
            class="mushaf-nav"
            id="mushaf-next"
          >
            التالية ›
          </button>

        </div>

        <div
          class="mushaf-image-container"
          id="mushaf-image-container"
        >

          <img
            id="mushaf-page-image"
            src="https://cdn.myquran.com/img/page/${page}.png"
            alt="صفحة القرآن الكريم ${page}"
            draggable="false"
          >

        </div>

        <div class="mushaf-bottom">

          <button
            class="mushaf-save"
            id="mushaf-save"
          >
            🔖 حفظ مكاني
          </button>

        </div>

      </div>

    `;

    const reader =
      document.getElementById(
        'mushaf-reader'
      );

    const image =
      document.getElementById(
        'mushaf-page-image'
      );

    const pageNumber =
      document.getElementById(
        'mushaf-page-number'
      );

    const prev =
      document.getElementById(
        'mushaf-prev'
      );

    const next =
      document.getElementById(
        'mushaf-next'
      );

    const save =
      document.getElementById(
        'mushaf-save'
      );

    function showPage(
      newPage,
      updateTitle = true
    ){

      if(
        newPage < 1 ||
        newPage > PAGES_TOTAL
      ){
        return;
      }

      page =
        newPage;

      image.src =
        `https://cdn.myquran.com/img/page/${page}.png`;

      image.alt =
        `صفحة القرآن الكريم ${page}`;

      pageNumber.textContent =
        `الصفحة ${toAr(page)} / ${toAr(PAGES_TOTAL)}`;

      prev.disabled =
        page === 1;

      next.disabled =
        page === PAGES_TOTAL;

      currentView = {
        type:'page',
        number:page
      };

      if(updateTitle){

        appTitle.textContent =
          'الصفحة ' +
          toAr(page);

      }

    }

    prev.addEventListener(
      'click',
      () => {

        showPage(
          page - 1
        );

        window.scrollTo(
          0,
          0
        );

      }
    );

    next.addEventListener(
      'click',
      () => {

        showPage(
          page + 1
        );

        window.scrollTo(
          0,
          0
        );

      }
    );

    save.addEventListener(
      'click',
      () => {

        saveBookmark({

          type:'page',

          number:page,

          label:
            'الصفحة ' +
            toAr(page)

        });

        showToast(
          'تم حفظ مكانك ✓'
        );

      }
    );

    /* ================= SWIPE ================= */

    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    reader.addEventListener(
      'touchstart',
      e => {

        if(
          !e.touches ||
          !e.touches.length
        ){
          return;
        }

        touchStartX =
          e.touches[0].clientX;

        touchStartY =
          e.touches[0].clientY;

        touchStartTime =
          Date.now();

      },
      {
        passive:true
      }
    );

    reader.addEventListener(
      'touchend',
      e => {

        if(
          !e.changedTouches ||
          !e.changedTouches.length
        ){
          return;
        }

        const touch =
          e.changedTouches[0];

        const deltaX =
          touch.clientX -
          touchStartX;

        const deltaY =
          touch.clientY -
          touchStartY;

        const elapsed =
          Date.now() -
          touchStartTime;

        const minSwipe =
          60;

        if(
          Math.abs(deltaX) >
            minSwipe &&

          Math.abs(deltaX) >
            Math.abs(deltaY) &&

          elapsed < 700
        ){

          if(deltaX < 0){

            /*
             * السحب إلى اليسار
             * = الصفحة التالية
             */

            showPage(
              page + 1
            );

          }else{

            /*
             * السحب إلى اليمين
             * = الصفحة السابقة
             */

            showPage(
              page - 1
            );

          }

          window.scrollTo(
            0,
            0
          );

        }

      },
      {
        passive:true
      }
    );

    /*
     * حفظ الصفحة الحالية تلقائياً
     * في الذاكرة المحلية عند التنقل.
     * هذا لا يعرض رسالة للمستخدم.
     */

    function autoSavePage(){

      saveBookmark({

        type:'page',

        number:page,

        label:
          'الصفحة ' +
          toAr(page)

      });

    }

    /*
     * عند تغيير الصفحة نحفظ المكان.
     */

    const originalShowPage =
      showPage;

    /*
     * تحديث الحالة الأولية.
     */

    currentView = {
      type:'page',
      number:page
    };

    prev.disabled =
      page === 1;

    next.disabled =
      page === PAGES_TOTAL;

    /*
     * حفظ تلقائي عند مغادرة الصفحة.
     */

    window.addEventListener(
      'beforeunload',
      autoSavePage,
      {
        once:true
      }
    );

  }

  async function renderSurah(
    number,
    scrollToNum
  ){

    app.innerHTML =

        window.surahCache &&
        window.surahCache[number];

        const res =
          await fetch(
            `${API}/surah/${number}/editions/quran-uthmani,ar.muyassar,ar.alafasy`
          );

        const json =
          await res.json();

        data =
          json.data;

        if(!window.surahCache){
          window.surahCache = {};
        }

        window.surahCache[number] =
          data;

      }

      const uthmani =
        data[0];

      const tafsir =
        data[1];

      const audio =
        data[2];

      currentView = {

        type:'surah',

        number:
          uthmani.number,

        name:
          uthmani.name

      };

      currentAudioQueue =
        audio.ayahs.map(
          a => ({

            id:
              a.numberInSurah,

            url:
              a.audio,

            surahName:
              uthmani.name,

            ayahNum:
              a.numberInSurah

          })
        );

      const showBismillah =
        uthmani.number !== 1 &&
        uthmani.number !== 9;

      const reciterId =
        getReciterId();

      const reciterOptionsHtml =
        buildReciterOptionsHtml(

        );

        )
        .addEventListener(
          'change',
          e => {

            setReciterId(
              e.target.value
            );

            stopAudio();

            renderSurah(
              uthmani.number
            );

          }
        );

      const playSurahBtn =
        document.getElementById(
          'play-surah'
        );

      if(playSurahBtn){

        playSurahBtn.addEventListener(
          'click',
          () => {

            const rid =
              getReciterId();

            const r =
              RECITERS[rid];

            if(r.mode === 'ayah'){

              playFrom(0);

            }else{

              if(
                !reciterAvailableForSurah(
                  rid,
                  uthmani.number
                )
              ){
                return;
              }

              playSurahFull(
                uthmani.number,
                uthmani.name,
                rid
              );

            }

          }
        );

      }

      app
        .querySelectorAll(
          '.tafsir-toggle'
        )
        .forEach(btn => {

          btn.addEventListener(
            'click',
            e => {

              e.stopPropagation();

              const t =
                document.getElementById(
                  btn.getAttribute(
                    'data-tid'
                  )
                );

              t.hidden =
                !t.hidden;

            }
          );

        });

      app
        .querySelectorAll(
          '.ayah-block'
        )
        .forEach(block => {

          block.addEventListener(
            'click',
            () => {

              const rid =
                getReciterId();

              if(
                RECITERS[rid].mode ===
                'ayah'
              ){

                const idx =
                  Number(
                    block.getAttribute(
                      'data-idx'
                    )
                  );

                playFrom(idx);

              }

            }
          );

        });

      if(scrollToNum){

        const target =
          document.getElementById(
            `ayah-${scrollToNum}`
          );

        if(target){

          target.scrollIntoView({
            behavior:'smooth',
            block:'center'
          });

        }

      }

    }catch(err){

      app.innerHTML = `

        <div class="state-msg">

          تعذر تحميل السورة.

          <br><br>

          تأكد من اتصال الإنترنت
          ثم حاول مرة أخرى.

        </div>

      `;

    }

  }

     HADITH READER
     ===================================================== */

  function classifyHadithGrade(
    grades
  ){

    if(
      !grades ||
      !grades.length
    ){
      return null;
    }

    let strong = 0;
    let weak = 0;

    grades.forEach(
      g => {

        const v =
          (
            g.grade || ''
          ).toLowerCase();

        if(
          v.indexOf('daif') !== -1 ||
          v.indexOf('munkar') !== -1 ||
          v.indexOf('mawdu') !== -1 ||
          v.indexOf('matruk') !== -1
        ){

          weak++;

        }else if(
          v.indexOf('sahih') !== -1 ||
          v.indexOf('hasan') !== -1
        ){

          strong++;

        }

      }
    );

    if(
      weak > 0 &&
      strong === 0
    ){
      return 'weak';
    }

    if(
      weak > 0 &&
      strong > 0
    ){
      return 'disputed';
    }

    return null;

  }
