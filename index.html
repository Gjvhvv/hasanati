<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسناتي</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E3B2E">
<link rel="icon" href="icons/icon-192.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap');

:root{
--ink:#1C1B16;
--paper:#F6EFDD;
--paper2:#EFE6CE;
--green:#0E3B2E;
--green2:#1F5C46;
--gold:#B8863E;
--gold2:#EDE0BD;
--muted:#77694f;
--line:#ddd0ac;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
width:100%;
min-height:100%;
}

body{
background:var(--paper);
color:var(--ink);
font-family:'Tajawal',sans-serif;
padding-bottom:70px;
}

button,input,select{
font-family:'Tajawal',sans-serif;
}

header{
position:sticky;
top:0;
z-index:50;
background:var(--green);
color:var(--paper);
border-bottom:3px solid var(--gold);
}

.header-row{
width:100%;
max-width:720px;
margin:auto;
display:flex;
align-items:center;
gap:8px;
padding:10px 12px;
}

.header-actions{
display:flex;
align-items:center;
gap:2px;
}

.icon-btn{
background:none;
border:0;
color:var(--paper);
cursor:pointer;
padding:8px;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
}

.icon-btn:active{
background:rgba(255,255,255,.15);
}

.icon-btn svg{
width:22px;
height:22px;
}

.app-title{
flex:1;
text-align:center;
font-family:'Amiri Quran',serif;
font-size:1.2rem;
font-weight:700;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.search-wrap{
max-width:720px;
margin:auto;
padding:0 12px;
max-height:0;
overflow:hidden;
transition:.25s;
}

.search-wrap.open{
max-height:70px;
padding:9px 12px;
}

.search-row{
display:flex;
gap:6px;
border:1px solid rgba(255,255,255,.3);
background:rgba(255,255,255,.08);
border-radius:8px;
padding:4px;
}

.search-row input{
flex:1;
min-width:0;
background:transparent;
border:0;
outline:0;
color:white;
padding:8px;
font-size:1rem;
}

.search-row input::placeholder{
color:rgba(255,255,255,.6);
}

.search-row button{
background:var(--gold);
border:0;
border-radius:6px;
padding:0 15px;
font-weight:700;
color:var(--green);
}

main{
width:100%;
max-width:720px;
margin:auto;
padding:18px 12px 35px;
}

.state{
text-align:center;
color:var(--muted);
padding:45px 10px;
line-height:2;
}

.hero{
text-align:center;
padding:15px 8px 22px;
border-bottom:1px solid var(--line);
margin-bottom:15px;
}

.bismillah{
font-family:'Amiri Quran',serif;
font-size:1.9rem;
color:var(--green);
margin:0 0 5px;
}

.hero-sub{
color:var(--muted);
font-size:.85rem;
}

.tabs{
display:flex;
gap:7px;
margin-bottom:15px;
}

.tab{
flex:1;
background:var(--paper2);
border:1px solid var(--line);
border-radius:8px;
padding:10px 4px;
color:var(--muted);
font-weight:700;
cursor:pointer;
}

.tab.active{
background:var(--green);
border-color:var(--green);
color:white;
}

.surah-row,
.page-row{
display:flex;
align-items:center;
gap:13px;
padding:13px 4px;
border-bottom:1px solid var(--line);
cursor:pointer;
}

.surah-row:active,
.page-row:active{
background:var(--paper2);
}

.number{
width:37px;
height:37px;
border:1.5px solid var(--gold);
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
color:var(--green);
font-weight:700;
flex-shrink:0;
}

.info{
flex:1;
min-width:0;
}

.name{
font-family:'Amiri Quran',serif;
font-size:1.12rem;
}

.meta{
font-size:.8rem;
color:var(--muted);
margin-top:2px;
}

.arrow{
color:var(--muted);
font-size:1.3rem;
}

.pages-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
}

.page-item{
background:var(--paper2);
border:1px solid var(--line);
border-radius:8px;
padding:13px 5px;
text-align:center;
cursor:pointer;
color:var(--green);
font-weight:700;
}

.page-item:active{
background:var(--gold2);
}

.mushaf-top{
display:flex;
align-items:center;
justify-content:space-between;
gap:7px;
margin-bottom:10px;
}

.mushaf-btn{
background:var(--paper2);
border:1.5px solid var(--gold);
color:var(--green);
border-radius:8px;
padding:9px 12px;
font-weight:700;
cursor:pointer;
}

.mushaf-btn:disabled{
opacity:.4;
}

.page-number{
font-size:.8rem;
color:var(--muted);
text-align:center;
}

.mushaf-page{
width:100%;
min-height:calc(100vh - 145px);
background:#fffdf5;
border:2px solid var(--gold);
border-radius:4px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
padding:25px 15px 35px;
touch-action:pan-y;
user-select:none;
}

.mushaf-header{
text-align:center;
border-bottom:1px solid var(--line);
padding-bottom:9px;
margin-bottom:15px;
}

.mushaf-title{
font-family:'Amiri Quran',serif;
font-size:1.3rem;
color:var(--green);
}

.mushaf-info{
font-size:.75rem;
color:var(--muted);
margin-top:3px;
}

.mushaf-content{
font-family:'Amiri Quran',serif;
font-size:1.48rem;
line-height:2.35;
text-align:justify;
direction:rtl;
}

.ayah{
cursor:pointer;
}

.ayah.playing{
background:var(--gold2);
border-radius:5px;
}

.marker{
display:inline-flex;
align-items:center;
justify-content:center;
width:28px;
height:28px;
border:1.5px solid var(--gold);
border-radius:50%;
font-family:'Tajawal',sans-serif;
font-size:.7rem;
color:var(--green);
vertical-align:middle;
margin:0 3px;
}

.surah-divider{
text-align:center;
font-family:'Amiri Quran',serif;
font-size:1.3rem;
color:var(--green);
margin:12px 0;
}

.bismillah-small{
text-align:center;
font-family:'Amiri Quran',serif;
font-size:1.25rem;
color:var(--green);
margin:8px 0 13px;
}

.hadith-card{
padding:5px 2px 25px;
}

.hadith-nav{
display:flex;
align-items:center;
justify-content:space-between;
gap:7px;
margin-bottom:15px;
}

.hadith-text{
font-family:'Amiri Quran',serif;
font-size:1.3rem;
line-height:2.3;
}

.hadith-source{
background:var(--paper2);
border-radius:8px;
padding:13px;
color:var(--muted);
line-height:1.8;
font-size:.85rem;
}

.grade{
padding:10px;
border-radius:8px;
margin-bottom:15px;
font-weight:700;
}

.grade.weak{
background:#f6dcd6;
color:#7a2416;
}

.search-result{
padding:13px 4px;
border-bottom:1px solid var(--line);
cursor:pointer;
}

.search-ref{
color:var(--gold);
font-size:.8rem;
font-weight:700;
margin-bottom:5px;
}

.search-text{
font-family:'Amiri Quran',serif;
font-size:1.2rem;
line-height:2;
}

mark{
background:var(--gold2);
}

#audio-bar{
position:fixed;
bottom:0;
left:0;
right:0;
z-index:100;
background:var(--green);
color:white;
border-top:3px solid var(--gold);
display:none;
align-items:center;
gap:8px;
padding:8px 10px;
}

#audio-bar.show{
display:flex;
}

.audio-info{
flex:1;
min-width:0;
}

.audio-surah{
font-family:'Amiri Quran',serif;
font-size:.95rem;
}

.audio-ayah{
color:var(--gold);
font-size:.75rem;
}

#toast{
position:fixed;
bottom:85px;
left:50%;
transform:translateX(-50%) translateY(15px);
background:var(--green);
color:white;
padding:9px 16px;
border:1px solid var(--gold);
border-radius:20px;
opacity:0;
pointer-events:none;
transition:.25s;
z-index:200;
white-space:nowrap;
}

#toast.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

@media(max-width:600px){

main{
padding:12px 8px 30px;
}

.pages-grid{
grid-template-columns:repeat(4,1fr);
gap:6px;
}

.page-item{
padding:12px 3px;
font-size:.88rem;
}

.mushaf-page{
min-height:calc(100vh - 130px);
padding:21px 11px 28px;
border-left:1px solid var(--gold);
border-right:1px solid var(--gold);
}

.mushaf-content{
font-size:1.38rem;
line-height:2.22;
}

.marker{
width:26px;
height:26px;
font-size:.67rem;
}

}

@media(max-width:380px){

.mushaf-content{
font-size:1.28rem;
line-height:2.12;
}

.pages-grid{
grid-template-columns:repeat(3,1fr);
}

}
</style>
</head>

<body>

<header>

<div class="header-row">

<button
id="back-btn"
class="icon-btn"
style="display:none"
aria-label="رجوع">

<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2">
<path d="M15 6l-6 6 6 6"/>
</svg>

</button>

<div class="app-title" id="app-title">
حسناتي
</div>

<div class="header-actions">

<button
id="bookmark-btn"
class="icon-btn"
style="display:none"
aria-label="حفظ">

<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2">
<path d="M6 4h12v16l-6-4-6 4V4z"/>
</svg>

</button>

<button
id="search-btn"
class="icon-btn"
aria-label="بحث">

<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2">
<circle cx="11" cy="11" r="7"/>
<path d="M21 21l-4.3-4.3"/>
</svg>

</button>

</div>
</div>

<div class="search-wrap" id="search-wrap">

<div class="search-row">

<input
id="search-input"
type="text"
placeholder="ابحث في القرآن الكريم...">

<button id="search-go">
بحث
</button>

</div>

</div>

</header>

<main id="app">

<div class="state">
جاري التحميل...
</div>

</main>

<div id="audio-bar">

<button
id="audio-toggle"
class="icon-btn">

<svg id="audio-icon"
viewBox="0 0 24 24"
fill="currentColor">
<path d="M8 5v14l11-7z"/>
</svg>

</button>

<div class="audio-info">

<div id="audio-surah"
class="audio-surah"></div>

<div id="audio-ayah"
class="audio-ayah"></div>

</div>

<button
id="audio-stop"
class="icon-btn">

✕

</button>

</div>

<div id="toast"></div>

<script>

'use strict';

/* =========================
   CONFIG
========================= */

const API='https://api.alquran.cloud/v1';

const PAGES=604;

const LAST_PAGE_KEY='hasanatiLastPage';

const BOOKMARK_KEY='hasanatiBookmark';

let currentTab='surahs';
let currentView=null;
let surahs=null;
let pageCache={};
let surahCache={};
let audioQueue=[];
let audioIndex=-1;

const app=document.getElementById('app');
const appTitle=document.getElementById('app-title');
const backBtn=document.getElementById('back-btn');
const bookmarkBtn=document.getElementById('bookmark-btn');
const searchBtn=document.getElementById('search-btn');
const searchWrap=document.getElementById('search-wrap');
const searchInput=document.getElementById('search-input');
const searchGo=document.getElementById('search-go');
const toast=document.getElementById('toast');

const audio=new Audio();
const audioBar=document.getElementById('audio-bar');
const audioToggle=document.getElementById('audio-toggle');
const audioStop=document.getElementById('audio-stop');
const audioIcon=document.getElementById('audio-icon');
const audioSurah=document.getElementById('audio-surah');
const audioAyah=document.getElementById('audio-ayah');

/* =========================
   HELPERS
========================= */

function ar(n){
return String(n).replace(/[0-9]/g,x=>'٠١٢٣٤٥٦٧٨٩'[x]);
}

function esc(text){
const d=document.createElement('div');
d.textContent=text==null?'':String(text);
return d.innerHTML;
}

function toastMsg(text){
toast.textContent=text;
toast.classList.add('show');
clearTimeout(toast.timer);
toast.timer=setTimeout(()=>{
toast.classList.remove('show');
},1800);
}

/* =========================
   STORAGE
========================= */

function getLastPage(){
try{
const n=Number(localStorage.getItem(LAST_PAGE_KEY));
return n>=1&&n<=PAGES?n:1;
}catch(e){
return 1;
}
}

function saveLastPage(n){
try{
localStorage.setItem(LAST_PAGE_KEY,String(n));
}catch(e){}
}

function getBookmark(){
try{
return JSON.parse(localStorage.getItem(BOOKMARK_KEY)||'null');
}catch(e){
return null;
}
}

function saveBookmark(data){
try{
localStorage.setItem(
BOOKMARK_KEY,
JSON.stringify(data)
);
}catch(e){}
}

/* =========================
   HEADER
========================= */

function homeHeader(){
backBtn.style.display='none';
bookmarkBtn.style.display='none';
appTitle.textContent='حسناتي';
}

function subHeader(title){
backBtn.style.display='flex';
bookmarkBtn.style.display='flex';
appTitle.textContent=title;
}

backBtn.onclick=()=>{
stopAudio();
currentView=null;
homeHeader();
renderHome();
};

bookmarkBtn.onclick=()=>{
if(!currentView)return;

if(currentView.type==='page'){
saveBookmark({
type:'page',
page:currentView.page,
label:'الصفحة '+ar(currentView.page)
});
toastMsg('تم حفظ مكانك ✓');
}

if(currentView.type==='surah'){
saveBookmark({
type:'surah',
number:currentView.number,
label:currentView.name
});
toastMsg('تم حفظ السورة ✓');
}
};

/* =========================
   SEARCH
========================= */

searchBtn.onclick=()=>{
searchWrap.classList.toggle('open');

if(searchWrap.classList.contains('open')){
searchInput.focus();
}
};

searchGo.onclick=search;

searchInput.addEventListener('keydown',e=>{
if(e.key==='Enter')search();
});

async function search(){

const q=searchInput.value.trim();

if(!q)return;

subHeader('نتائج البحث');

app.innerHTML=
'<div class="state">جاري البحث...</div>';

try{

const r=await fetch(
API+'/search/'+encodeURIComponent(q)+'/all/ar'
);

if(!r.ok)throw new Error();

const j=await r.json();

const matches=j.data?.matches||[];

if(!matches.length){

app.innerHTML=
'<div class="state">لم يتم العثور على نتائج.</div>';

return;
}

const safeQ=esc(q);

app.innerHTML=`

<div style="
color:var(--muted);
font-size:.85rem;
margin-bottom:10px">

${ar(matches.length)} نتيجة

</div>

${matches.map(m=>`

<div
class="search-result"
data-surah="${m.surah.number}">

<div class="search-ref">
${esc(m.surah.name)}
— آية ${ar(m.numberInSurah)}
</div>

<div class="search-text">
${esc(m.text).replace(
new RegExp(
safeQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),
'g'
),
x=>'<mark>'+x+'</mark>'
)}
</div>

</div>

`).join('')}
`;

app.querySelectorAll('.search-result')
.forEach(el=>{
el.onclick=()=>{
searchWrap.classList.remove('open');
const n=Number(el.dataset.surah);
const s=surahs?.find(x=>x.number===n);
subHeader(s?s.name:'السورة');
renderSurah(n);
};
});

}catch(e){

app.innerHTML=
'<div class="state">تعذر البحث. تأكد من اتصال الإنترنت.</div>';

}
}

/* =========================
   HOME
========================= */

async function renderHome(){

homeHeader();

const bookmark=getBookmark();

app.innerHTML=`

<div class="hero">

<div class="bismillah">
بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
</div>

<div class="hero-sub">
القرآن الكريم · ١١٤ سورة · ٦٠٤ صفحة
</div>

</div>

${bookmark?`

<div
id="continue"
style="
background:var(--green);
color:white;
padding:13px;
border-radius:9px;
margin-bottom:14px;
cursor:pointer">

📖 متابعة:
<strong>${esc(bookmark.label)}</strong>

</div>

`:''}

<div class="tabs">

<button class="tab ${currentTab==='surahs'?'active':''}"
data-tab="surahs">
السور
</button>

<button class="tab ${currentTab==='pages'?'active':''}"
data-tab="pages">
الصفحات
</button>

<button class="tab ${currentTab==='hadith'?'active':''}"
data-tab="hadith">
الأحاديث
</button>

</div>

<div id="home-content"></div>
`;

if(bookmark){

document.getElementById('continue').onclick=()=>{
if(bookmark.type==='page'){
subHeader('صفحة '+ar(bookmark.page));
renderPage(bookmark.page);
}
else if(bookmark.type==='surah'){
subHeader(bookmark.label);
renderSurah(bookmark.number);
}
};

}

document.querySelectorAll('.tab')
.forEach(btn=>{
btn.onclick=()=>{
currentTab=btn.dataset.tab;
renderHome();
};
});

const content=
document.getElementById('home-content');

if(currentTab==='surahs'){
renderSurahs(content);
}

else if(currentTab==='pages'){
renderPages(content);
}

else{
renderHadithBooks(content);
}

}

/* =========================
   SURAH LIST
========================= */

async function renderSurahs(container){

container.innerHTML=
'<div class="state">جاري تحميل السور...</div>';

try{

if(!surahs){

const r=await fetch(API+'/surah');

if(!r.ok)throw new Error();

const j=await r.json();

surahs=j.data;
}

container.innerHTML=
surahs.map(s=>`

<div
class="surah-row"
data-num="${s.number}">

<div class="number">
${ar(s.number)}
</div>

<div class="info">

<div class="name">
${esc(s.name)}
</div>

<div class="meta">
${s.revelationType==='Meccan'?'مكية':'مدنية'}
· ${ar(s.numberOfAyahs)} آية
</div>

</div>

<div class="arrow">‹</div>

</div>

`).join('');

container.querySelectorAll('.surah-row')
.forEach(row=>{
row.onclick=()=>{
const n=Number(row.dataset.num);
const s=surahs.find(x=>x.number===n);
subHeader(s.name);
renderSurah(n);
};
});

}catch(e){

container.innerHTML=
'<div class="state">تعذر تحميل السور.<br>تأكد من اتصال الإنترنت.</div>';

}
}

/* =========================
   PAGES LIST
========================= */

function renderPages(container){

container.innerHTML=`

<div style="
text-align:center;
color:var(--muted);
font-size:.85rem;
margin-bottom:12px">

اختر رقم الصفحة لفتح المصحف

</div>

<div class="pages-grid">

${Array.from({length:PAGES},(_,i)=>`

<div
class="page-item"
data-page="${i+1}">

صفحة ${ar(i+1)}

</div>

`).join('')}

</div>
`;

container.querySelectorAll('.page-item')
.forEach(item=>{
item.onclick=()=>{
const n=Number(item.dataset.page);
subHeader('صفحة '+ar(n));
renderPage(n);
};
});

}

/* =========================
   MUSHAF PAGE
========================= */

async function renderPage(page){

page=Math.max(1,Math.min(PAGES,Number(page)||1));

stopAudio();

currentView={
type:'page',
page:page
};

saveLastPage(page);

saveBookmark({
type:'page',
page:page,
label:'الصفحة '+ar(page)
});

app.innerHTML=`

<div class="mushaf-top">

<button
class="mushaf-btn"
id="prev"
${page<=1?'disabled':''}>
‹ السابقة
</button>

<div class="page-number">
صفحة ${ar(page)} / ${ar(PAGES)}
</div>

<button
class="mushaf-btn"
id="next"
${page>=PAGES?'disabled':''}>
التالية ›
</button>

</div>

<div id="loading" class="state">
جاري تحميل صفحة المصحف...
</div>

<div
id="page-container"
style="display:none">
</div>
`;

document.getElementById('prev').onclick=()=>{
if(page>1)renderPage(page-1);
};

document.getElementById('next').onclick=()=>{
if(page<PAGES)renderPage(page+1);
};

try{

let data=pageCache[page];

if(!data){

const r=await fetch(
API+
'/page/'+
page+
'/editions/quran-uthmani,ar.alafasy'
);

if(!r.ok)throw new Error();

const j=await r.json();

data=j.data;

pageCache[page]=data;
}

const quran=data[0];
const audioData=data[1];

audioQueue=audioData.ayahs.map(a=>({
url:a.audio,
surah:a.surah.name,
ayah:a.numberInSurah,
id:a.number
}));

let html='';
let lastSurah=0;

/* =========================
   SWIPE
========================= */

function setupSwipe(el,page){

let sx=0;
let sy=0;
let time=0;

el.addEventListener('touchstart',e=>{
if(!e.touches.length)return;

sx=e.touches[0].clientX;
sy=e.touches[0].clientY;
time=Date.now();

},{passive:true});

el.addEventListener('touchend',e=>{

if(!e.changedTouches.length)return;

const ex=e.changedTouches[0].clientX;
const ey=e.changedTouches[0].clientY;

const dx=ex-sx;
const dy=ey-sy;

if(Date.now()-time>900)return;

if(Math.abs(dx)<60)return;

if(Math.abs(dx)<Math.abs(dy)*1.25)return;

/*
السحب إلى اليسار = التالية
السحب إلى اليمين = السابقة
*/

if(dx<0){

if(page<PAGES){
renderPage(page+1);
}

}else{

if(page>1){
renderPage(page-1);
}

}

},{passive:true});

}

/* =========================
   AUDIO
========================= */

function playAudio(index){

if(!audioQueue[index])return;

audioIndex=index;

audio.src=audioQueue[index].url;

audio.play().catch(()=>{});

updateAudio();

}

function updateAudio(){

const item=audioQueue[audioIndex];

if(!item)return;

audioSurah.textContent=item.surah;

audioAyah.textContent=
'آية '+ar(item.ayah);

audioBar.classList.add('show');

document.querySelectorAll('.ayah,.surah-ayah')
.forEach(x=>x.classList.remove('playing'));

const elements=
document.querySelectorAll('.ayah,.surah-ayah');

if(elements[audioIndex]){
elements[audioIndex].classList.add('playing');
}

}

audio.addEventListener('ended',()=>{

if(audioIndex+1<audioQueue.length){

playAudio(audioIndex+1);

}else{

stopAudio();

}

});

audio.addEventListener('play',()=>{
audioIcon.innerHTML=
'<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
});

audio.addEventListener('pause',()=>{
audioIcon.innerHTML=
'<path d="M8 5v14l11-7z"/>';
});

audioToggle.onclick=()=>{

if(audio.paused){
audio.play().catch(()=>{});
}else{
audio.pause();
}

};

function stopAudio(){

audio.pause();

audio.removeAttribute('src');

audioQueue=[];
audioIndex=-1;

document.querySelectorAll('.ayah,.surah-ayah')
.forEach(x=>x.classList.remove('playing'));

audioBar.classList.remove('show');

}

audioStop.onclick=stopAudio;
