<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>حسناتي</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E3B2E">
<link rel="icon" href="icons/icon-192.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap');

:root{
  --ink:#1C1B16;
  --paper:#F6EFDD;
  --paper-2:#EFE6CE;
  --green-deep:#0E3B2E;
  --green-mid:#1F5C46;
  --gold:#B8863E;
  --gold-soft:#EDE0BD;
  --muted:#77694f;
  --line:#ddd0ac;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Tajawal',sans-serif;
  padding-bottom:70px;
}

/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:var(--green-deep);
  color:var(--paper);
  border-bottom:3px solid var(--gold);
}

.header-row{
  width:100%;
  max-width:720px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 14px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:2px;
}

.icon-btn{
  background:none;
  border:none;
  color:var(--paper);
  cursor:pointer;
  padding:7px;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:hover{
  background:rgba(255,255,255,.1);
}

.icon-btn svg{
  width:22px;
  height:22px;
}

.app-title{
  flex:1;
  text-align:center;
  font-family:'Amiri Quran',serif;
  font-size:1.15rem;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.search-bar-wrap{
  max-width:720px;
  margin:auto;
  padding:0 14px;
  overflow:hidden;
  max-height:0;
  transition:.25s ease;
}

.search-bar-wrap.open{
  max-height:70px;
  padding:10px 14px;
}

.search-input-row{
  display:flex;
  gap:7px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.25);
  border-radius:8px;
  padding:4px;
}

.search-input-row input{
  flex:1;
  background:none;
  border:none;
  outline:none;
  color:white;
  font-family:'Tajawal',sans-serif;
  font-size:1rem;
  padding:8px;
}

.search-input-row input::placeholder{
  color:rgba(255,255,255,.55);
}

.search-input-row button{
  background:var(--gold);
  border:none;
  color:var(--green-deep);
  font-weight:700;
  border-radius:6px;
  padding:0 15px;
}

/* ================= MAIN ================= */

main{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:20px 16px 40px;
}

.state-msg{
  text-align:center;
  color:var(--muted);
  padding:45px 10px;
  line-height:2;
}

/* ================= HOME ================= */

.hero{
  text-align:center;
  padding:18px 10px 25px;
  border-bottom:1px solid var(--line);
  margin-bottom:18px;
}

.hero .bismillah{
  font-family:'Amiri Quran',serif;
  font-size:2rem;
  color:var(--green-deep);
  margin:0 0 6px;
}

.hero .sub{
  color:var(--muted);
  font-size:.9rem;
  margin:0;
}

.continue-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:var(--green-deep);
  color:var(--paper);
  border-radius:10px;
  padding:13px 14px;
  margin-bottom:16px;
  cursor:pointer;
}

.continue-text{
  font-size:.9rem;
}

.continue-text strong{
  color:var(--gold);
  font-family:'Amiri Quran',serif;
  font-size:1.03rem;
}

.continue-clear{
  background:none;
  border:none;
  color:white;
  opacity:.75;
  cursor:pointer;
  font-size:1rem;
}

.home-tabs{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.home-tab{
  flex:1;
  background:var(--paper-2);
  border:1.5px solid var(--line);
  color:var(--muted);
  border-radius:8px;
  padding:10px 0;
  font-weight:700;
  font-size:.92rem;
  cursor:pointer;
}

.home-tab.active{
  background:var(--green-deep);
  color:var(--paper);
  border-color:var(--green-deep);
}

/* ================= SURAH LIST ================= */

.surah-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px 4px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.surah-row:hover{
  background:var(--paper-2);
}

.surah-num{
  flex-shrink:0;
  width:36px;
  height:36px;
  border:1.5px solid var(--gold);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green-deep);
  font-weight:700;
}

.surah-info{
  flex:1;
  min-width:0;
}

.surah-name{
  font-family:'Amiri Quran',serif;
  font-size:1.15rem;
}

.surah-meta{
  color:var(--muted);
  font-size:.82rem;
  margin-top:2px;
}

.surah-arrow{
  color:var(--muted);
}

/* ================= READING HOME ================= */

.reading-home{
  text-align:center;
  padding-top:15px;
}

.reading-icon{
  font-size:55px;
  margin-bottom:10px;
}

.reading-home h2{
  font-family:'Amiri Quran',serif;
  color:var(--green-deep);
  font-size:1.8rem;
  margin:8px 0;
}

.reading-home p{
  color:var(--muted);
  line-height:1.9;
}

.start-reading{
  width:100%;
  background:var(--green-deep);
  color:white;
  border:none;
  border-radius:10px;
  padding:14px;
  font-family:'Tajawal',sans-serif;
  font-size:1rem;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
}

.reading-last{
  margin-top:12px;
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:9px;
  padding:12px;
  color:var(--muted);
  cursor:pointer;
}

/* ================= MUSHAF ================= */

.mushaf-view{
  width:100%;
  margin:0;
  padding:0;
}

.mushaf-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}

.mushaf-btn{
  background:var(--paper-2);
  border:1.5px solid var(--gold);
  color:var(--green-deep);
  border-radius:8px;
  padding:9px 13px;
  font-family:'Tajawal',sans-serif;
  font-weight:700;
  cursor:pointer;
}

.mushaf-btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.mushaf-page-number{
  color:var(--muted);
  font-size:.84rem;
  text-align:center;
}

/*
  صفحة المصحف:
  نحاول جعلها بعرض شاشة الجهاز بالكامل تقريباً
  مع ارتفاع مناسب.
*/

.mushaf-page{
  position:relative;
  width:100%;
  min-height:calc(100vh - 150px);
  background:#fffdf5;
  border:2px solid var(--gold);
  border-radius:4px;
  box-shadow:0 2px 12px rgba(0,0,0,.10);
  padding:28px 18px 35px;
  overflow:hidden;
  touch-action:pan-y;
  user-select:none;
  -webkit-user-select:none;
}

.mushaf-page-header{
  text-align:center;
  border-bottom:1px solid var(--line);
  padding-bottom:10px;
  margin-bottom:18px;
}

.mushaf-page-header .surah-title{
  font-family:'Amiri Quran',serif;
  color:var(--green-deep);
  font-size:1.35rem;
}

.mushaf-page-header .page-info{
  color:var(--muted);
  font-size:.75rem;
  margin-top:3px;
}

.mushaf-content{
  font-family:'Amiri Quran',serif;
  font-size:1.65rem;
  line-height:2.45;
  text-align:justify;
  direction:rtl;
}

.mushaf-ayah{
  cursor:pointer;
}

.mushaf-ayah.playing{
  background:var(--gold-soft);
  border-radius:5px;
}

.mushaf-marker{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:29px;
  height:29px;
  border:1.5px solid var(--gold);
  border-radius:50%;
  font-family:'Tajawal',sans-serif;
  font-size:.76rem;
  color:var(--green-deep);
  vertical-align:middle;
  margin:0 3px;
}

.mushaf-surah-divider{
  text-align:center;
  margin:12px 0 12px;
  color:var(--green-deep);
  font-family:'Amiri Quran',serif;
  font-size:1.35rem;
}

.mushaf-bismillah{
  text-align:center;
  font-family:'Amiri Quran',serif;
  font-size:1.35rem;
  color:var(--green-deep);
  margin:8px 0 15px;
}

/* ================= HADITH ================= */

.hadith-card{
  padding:5px 3px 25px;
}

.hadith-text{
  font-family:'Amiri Quran',serif;
  font-size:1.3rem;
  line-height:2.3;
}

.hadith-source{
  background:var(--paper-2);
  border-radius:8px;
  padding:13px;
  color:var(--muted);
  font-size:.86rem;
  line-height:1.9;
}

.hadith-source strong{
  color:var(--green-deep);
}

.grade-banner{
  padding:10px 13px;
  border-radius:8px;
  margin-bottom:15px;
  font-weight:700;
}

.grade-banner.weak{
  background:#f6dcd6;
  color:#7a2416;
  border:1px solid #b3543c;
}

.grade-banner.disputed{
  background:#f8ecd0;
  color:#7a5a10;
  border:1px solid var(--gold);
}

.hadith-nav-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:15px;
}

.hadith-jump-row{
  display:flex;
  gap:8px;
  margin-bottom:18px;
}

.hadith-jump-row input{
  flex:1;
  border:1.5px solid var(--gold);
  border-radius:8px;
  padding:9px;
  background:var(--paper-2);
}

.hadith-jump-row button{
  background:var(--gold);
  border:none;
  border-radius:8px;
  padding:0 16px;
  font-weight:700;
}

/* ================= SEARCH ================= */

.search-result{
  padding:14px 4px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}

.search-result .ref{
  color:var(--gold);
  font-size:.8rem;
  font-weight:700;
  margin-bottom:6px;
}

.search-result .txt{
  font-family:'Amiri Quran',serif;
  font-size:1.25rem;
  line-height:2;
}

mark{
  background:var(--gold-soft);
  border-radius:3px;
}

/* ================= AUDIO ================= */

#audio-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:100;
  background:var(--green-deep);
  color:var(--paper);
  border-top:3px solid var(--gold);
  display:none;
  align-items:center;
  gap:10px;
  padding:9px 12px;
}

#audio-bar.show{
  display:flex;
}

.audio-info{
  flex:1;
  min-width:0;
}

.audio-info .s-name{
  font-family:'Amiri Quran',serif;
  font-size:1rem;
}

.audio-info .a-num{
  color:var(--gold);
  font-size:.78rem;
}

#toast{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--green-deep);
  color:white;
  padding:10px 18px;
  border-radius:20px;
  font-size:.88rem;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:150;
  border:1px solid var(--gold);
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  main{
    padding:12px 9px 30px;
  }

  .hero{
    padding-top:14px;
  }

  .hero .bismillah{
    font-size:1.65rem;
  }

  .mushaf-page{
    min-height:calc(100vh - 130px);
    padding:23px 13px 28px;
    border-left:1px solid var(--gold);
    border-right:1px solid var(--gold);
  }

  .mushaf-content{
    font-size:1.42rem;
    line-height:2.25;
  }

  .mushaf-marker{
    width:27px;
    height:27px;
    font-size:.7rem;
  }

  .mushaf-page-header .surah-title{
    font-size:1.2rem;
  }
}

@media(max-width:380px){

  .mushaf-content{
    font-size:1.3rem;
    line-height:2.15;
  }

  .mushaf-page{
    padding-left:10px;
    padding-right:10px;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-row">

    <button
      class="icon-btn"
      id="back-btn"
      style="display:none"
      aria-label="رجوع">

      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="2">

        <path d="M15 6l-6 6 6 6"/>

      </svg>

    </button>

    <div class="app-title" id="app-title">
      حسناتي
    </div>

    <div class="header-actions">

      <button
        class="icon-btn"
        id="bookmark-btn"
        style="display:none"
        aria-label="حفظ مكاني">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">

          <path d="M6 4h12v16l-6-4-6 4V4z"/>

        </svg>

      </button>

      <button
        class="icon-btn"
        id="search-btn"
        aria-label="بحث">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2">

          <circle cx="11" cy="11" r="7"/>
          <path d="M21 21l-4.3-4.3"/>

        </svg>

      </button>

    </div>

  </div>

  <div class="search-bar-wrap" id="search-wrap">

    <div class="search-input-row">

      <input
        type="text"
        id="search-input"
        placeholder="ابحث في آيات القرآن الكريم...">

      <button id="search-go">
        بحث
      </button>

    </div>

  </div>

</header>


<main id="app">

  <div class="state-msg">
    جاري التحميل...
  </div>

</main>


<div id="audio-bar">

  <button
    class="icon-btn"
    id="audio-toggle"
    aria-label="تشغيل وإيقاف">

    <svg
      id="audio-icon"
      viewBox="0 0 24 24"
      fill="currentColor">

      <path d="M8 5v14l11-7z"/>

    </svg>

  </button>

  <div class="audio-info">

    <div
      class="s-name"
      id="audio-surah-name">
    </div>

    <div
      class="a-num"
      id="audio-ayah-num">
    </div>

  </div>

  <button
    class="icon-btn"
    id="audio-stop"
    aria-label="إيقاف">

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2">

      <path d="M6 6l12 12M18 6L6 18"/>

    </svg>

  </button>

</div>


<div id="toast"></div>


<script>

(function(){

'use strict';


/* =========================================================
   CONFIG
========================================================= */

const API =
  'https://api.alquran.cloud/v1';

const HADITH_API =
  'https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1';

const PAGES_TOTAL = 604;

const BOOKMARK_KEY =
  'hasanatiBookmark';

const READING_PAGE_KEY =
  'hasanatiLastReadingPage';

const RECITER_STORAGE_KEY =
  'hasanatiReciter';


/* =========================================================
   ELEMENTS
========================================================= */

const app =
  document.getElementById('app');

const appTitle =
  document.getElementById('app-title');

const backBtn =
  document.getElementById('back-btn');

const bookmarkBtn =
  document.getElementById('bookmark-btn');

const searchBtn =
  document.getElementById('search-btn');

const searchWrap =
  document.getElementById('search-wrap');

const searchInput =
  document.getElementById('search-input');

const searchGo =
  document.getElementById('search-go');

const toastEl =
  document.getElementById('toast');


/* =========================================================
   STATE
========================================================= */

let surahList = null;

let surahCache = {};

let pageCache = {};

let hadithCache = {};

let currentHomeTab = 'surahs';

let currentView = null;

let currentPageNumber = 1;

let currentHadithBook = null;

let currentHadithNumber = null;


/* =========================================================
   HADITH BOOKS
========================================================= */

const HADITH_BOOKS = {

  bukhari:{
    name:'صحيح البخاري',
    author:'الإمام محمد بن إسماعيل البخاري',
    maxHint:7563,
    consensusSahih:true
  },

  muslim:{
    name:'صحيح مسلم',
    author:'الإمام مسلم بن الحجاج النيسابوري',
    maxHint:7563,
    consensusSahih:true
  },

  abudawud:{
    name:'سنن أبي داود',
    author:'الإمام أبو داود السجستاني',
    maxHint:5274
  },

  tirmidhi:{
    name:'جامع الترمذي',
    author:'الإمام أبو عيسى الترمذي',
    maxHint:3956
  },

  nasai:{
    name:'سنن النسائي',
    author:'الإمام أحمد بن شعيب النسائي',
    maxHint:5758
  },

  ibnmajah:{
    name:'سنن ابن ماجه',
    author:'الإمام محمد بن يزيد ابن ماجه',
    maxHint:4341
  },

  malik:{
    name:'موطأ الإمام مالك',
    author:'الإمام مالك بن أنس',
    maxHint:1858
  },

  nawawi:{
    name:'الأربعون النووية',
    author:'الإمام يحيى بن شرف النووي',
    maxHint:42
  },

  qudsi:{
    name:'الأربعون القدسية',
    author:'',
    maxHint:40
  },

  dehlawi:{
    name:'أربعون شاه ولي الله',
    author:'شاه ولي الله الدهلوي',
    maxHint:40
  }

};

const HADITH_ORDER = [
  'bukhari',
  'muslim',
  'abudawud',
  'tirmidhi',
  'nasai',
  'ibnmajah',
  'malik',
  'nawawi',
  'qudsi',
  'dehlawi'
];


/* =========================================================
   RECITERS
========================================================= */

const RECITERS = {

  alafasy:{
    name:'مشاري راشد العفاسي',
    mode:'ayah'
  },

  salman:{
    name:'سلمان العتيبي',
    mode:'surah',
    server:'https://server11.mp3quran.net/salman/',
    surahs:[
      1,2,3,10,11,14,16,19,23,25,
      32,36,38,39,40,46,48,50,52,
      55,56,58,59,61,62,63,64,
      66,67,68,69,70,71,72,73,
      74,75,76,77,78,79,80,81,
      82,83,84,85,86,87,88,89,
      90,91,92,93,94,95,96,97,
      98,99,100,101,102,103,104,
      105,106,107,108,109,110,
      111,112,113,114
    ]
  },

  lhaidan:{
    name:'محمد اللحيدان',
    mode:'surah',
    server:'https://server8.mp3quran.net/lhdan/',
    surahs:'all'
  }

};


/* =========================================================
   HELPERS
========================================================= */

const arDigits =
  ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];

function toAr(n){

  return String(n)
    .replace(/[0-9]/g,
      d => arDigits[d]);

}

function revTypeAr(t){

  return t === 'Meccan'
    ? 'مكية'
    : 'مدنية';

}

function escapeHtml(text){

  const div =
    document.createElement('div');

  div.textContent =
    text == null ? '' : String(text);

  return div.innerHTML;

}

function escapeReg(s){

  return s.replace(
    /[.*+?^${}()|[\]\\]/g,
    '\\$&'
  );

}

function showToast(msg){

  toastEl.textContent = msg;

  toastEl.classList.add('show');

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(
      () => toastEl.classList.remove('show'),
      1800
    );

}


/* =========================================================
   RECITER STORAGE
========================================================= */

function getReciterId(){

  try{

    const saved =
      localStorage.getItem(
        RECITER_STORAGE_KEY
      );

    if(saved && RECITERS[saved]){
      return saved;
    }

  }catch(e){}

  return 'alafasy';

}

function setReciterId(id){

  try{

    localStorage.setItem(
      RECITER_STORAGE_KEY,
      id
    );

  }catch(e){}

}

function pad3(n){

  return String(n).padStart(3,'0');

}

function reciterAvailableForSurah(
  reciterId,
  surahNumber
){

  const r =
    RECITERS[reciterId];

  if(!r) return false;

  if(r.mode !== 'surah'){
    return true;
  }

  if(r.surahs === 'all'){
    return true;
  }

  return r.surahs.includes(
    surahNumber
  );

}

function surahAudioUrl(
  reciterId,
  surahNumber
){

  const r =
    RECITERS[reciterId];

  return r.server +
    pad3(surahNumber) +
    '.mp3';

}

function buildReciterOptionsHtml(id){

  return Object.entries(
    RECITERS
  ).map(([key,r]) => {

    return `
      <option
        value="${key}"
        ${key === id ? 'selected' : ''}>
        ${escapeHtml(r.name)}
      </option>
    `;

  }).join('');

}

function clearBookmark(){

function getLastReadingPage(){

      );

/* =========================================================

========================================================= */

async function renderReading(
  pageNumber
){

  pageNumber =
    Math.max(
      1,
      Math.min(
        PAGES_TOTAL,
        Number(pageNumber) || 1
      )
    );


  stopAudio();


  currentPageNumber =
    pageNumber;


  currentView = {
    type:'reading',
    page:pageNumber
  };


  saveLastReadingPage(
    pageNumber
  );


  app.innerHTML = `

    <div class="mushaf-view">

      <div class="mushaf-top">

        <button
          class="mushaf-btn"
          id="mushaf-prev"
          ${pageNumber <= 1
            ? 'disabled'
            : ''}>

          ‹ السابقة

        </button>

        <div
          class="mushaf-page-number">

          صفحة
          ${toAr(pageNumber)}
          /
          ${toAr(PAGES_TOTAL)}

        </div>

        <button
          class="mushaf-btn"
          id="mushaf-next"
          ${pageNumber >= PAGES_TOTAL
            ? 'disabled'
            : ''}>

          التالية ›

        </button>

      </div>

      <div
        class="state-msg"
        id="mushaf-loading">

        جاري تحميل صفحة المصحف...

      </div>

      <div
        id="mushaf-page-container"
        style="display:none">

      </div>

    </div>

  `;


  const prev =
    document.getElementById(
      'mushaf-prev'
    );

  const next =
    document.getElementById(
      'mushaf-next'
    );


  prev.addEventListener(
    'click',
    () => {

      if(pageNumber > 1){

        renderReading(
          pageNumber - 1
        );

      }

    }
  );


  next.addEventListener(
    'click',
    () => {

      if(
        pageNumber <
        PAGES_TOTAL
      ){

        renderReading(
          pageNumber + 1
        );

      }

    }
  );


  try{

    let data =
      pageCache[pageNumber];


    if(!data){

      const res =
        await fetch(
          `${API}/page/${pageNumber}/editions/quran-uthmani,ar.muyassar,ar.alafasy`
        );

      if(!res.ok){
        throw new Error(
          'page-load'
        );
      }

      const json =
        await res.json();

      data =
        json.data;

      pageCache[
        pageNumber
      ] = data;

    }


    const uthmani =
      data[0];

    const tafsir =
      data[1];

    const audio =
      data[2];


    currentView = {
      type:'reading',
      page:pageNumber
    };


    currentAudioQueue =
      audio.ayahs.map(
        a => ({

          id:a.number,

          url:a.audio,

          surahName:
            a.surah.name,

          ayahNum:
            a.numberInSurah

        })
      );


    const loading =
      document.getElementById(
        'mushaf-loading'
      );

    const container =
      document.getElementById(
        'mushaf-page-container'
      );


    let lastSurah = null;

    let content = '';


    uthmani.ayahs.forEach(
      (a,i) => {

        if(
          a.surah.number !==
          lastSurah
        ){

          lastSurah =
            a.surah.number;


          content += `

            <div
              class="mushaf-surah-divider">

              ${escapeHtml(
                a.surah.name
              )}

            </div>

          `;


          if(
            a.numberInSurah === 1 &&
            a.surah.number !== 1 &&
            a.surah.number !== 9
          ){

            content += `

              <div
                class="mushaf-bismillah">

                بِسْمِ اللَّهِ
                الرَّحْمَٰنِ الرَّحِيمِ

              </div>

            `;

          }

        }


        const tafsirText =
          tafsir.ayahs[i]
          ? tafsir.ayahs[i].text
          : '';


        content += `

          <span
            class="mushaf-ayah"
            data-idx="${i}"
            data-tafsir="${encodeURIComponent(
              tafsirText
            )}">

            ${escapeHtml(a.text)}

            <span
              class="mushaf-marker">

              ${toAr(
                a.numberInSurah
              )}

            </span>

          </span>

        `;

      }
    );


    container.innerHTML = `

      <div
        class="mushaf-page"
        id="mushaf-page">

        <div
          class="mushaf-page-header">

          <div
            class="surah-title">

            ${
              uthmani.ayahs.length
              ? escapeHtml(
                  uthmani.ayahs[0].surah.name
                )
              : 'القرآن الكريم'
            }

          </div>

          <div
            class="page-info">

            الصفحة
            ${toAr(pageNumber)}

          </div>

        </div>

        <div
          class="mushaf-content">

          ${content}

        </div>

      </div>

    `;


    loading.style.display =
      'none';

    container.style.display =
      'block';


    /* =====================================================
       AUDIO AYAH CLICK
    ===================================================== */

    container
      .querySelectorAll(
        '.mushaf-ayah'
      )
      .forEach(el => {

        el.addEventListener(
          'click',
          () => {

            const rid =
              getReciterId();

            if(
              RECITERS[rid].mode ===
              'ayah'
            ){

              const idx =
                Number(
                  el.dataset.idx
                );

              playFrom(idx);

            }

          }
        );

      });


    /* =====================================================
       SWIPE
    ===================================================== */

    setupMushafSwipe(
      document.getElementById(
        'mushaf-page'
      ),
      pageNumber
    );


    window.scrollTo(
      0,
      0
    );


  }catch(err){

    const loading =
      document.getElementById(
        'mushaf-loading'
      );

    if(loading){

      loading.innerHTML = `

        تعذر تحميل صفحة المصحف.<br>

        تأكد من اتصال الإنترنت ثم
        حاول مرة أخرى.

        <br><br>

        <button
          class="mushaf-btn"
          id="retry-page">

          إعادة المحاولة

        </button>

      `;

      const retry =
        document.getElementById(
          'retry-page'
        );

      retry.addEventListener(
        'click',
        () => renderReading(
          pageNumber
        )
      );

    }

  }

}


/* =========================================================
   SWIPE CONTROL
========================================================= */

function setupMushafSwipe(
  element,
  pageNumber
){

  if(!element) return;


  let startX = 0;

  let startY = 0;

  let startTime = 0;


  element.addEventListener(
    'touchstart',
    e => {

      if(
        !e.touches ||
        !e.touches.length
      ){
        return;
      }

      startX =
        e.touches[0].clientX;

      startY =
        e.touches[0].clientY;

      startTime =
        Date.now();

    },
    {
      passive:true
    }
  );


  element.addEventListener(
    'touchend',
    e => {

      if(
        !e.changedTouches ||
        !e.changedTouches.length
      ){
        return;
      }


      const endX =
        e.changedTouches[0].clientX;

      const endY =
        e.changedTouches[0].clientY;


      const dx =
        endX - startX;

      const dy =
        endY - startY;

      const duration =
        Date.now() - startTime;


      /*
        يجب أن يكون السحب أفقياً
        وليس مجرد تمرير عمودي.
      */

      if(
        Math.abs(dx) < 55
      ){
        return;
      }

      if(
        Math.abs(dx) <
        Math.abs(dy) * 1.25
      ){
        return;
      }

      if(
        duration > 900
      ){
        return;
      }


      /*
        RTL:
        سحب إلى اليسار = الصفحة التالية
        سحب إلى اليمين = الصفحة السابقة
      */

      if(dx < 0){

        if(
          pageNumber <
          PAGES_TOTAL
        ){

          renderReading(
            pageNumber + 1
          );

        }

      }else{

        if(pageNumber > 1){

          renderReading(
            pageNumber - 1
          );

        }

      }

    },
    {
      passive:true
    }
  );

}

function classifyHadithGrade(
  grades
){

  if(
    !grades ||
    !grades.length
  ){
    return null;
  }

  let strong = 0;

  let weak = 0;


  grades.forEach(
    g => {

      const v =
        (
          g.grade ||
          ''
        ).toLowerCase();


      if(
        v.includes('daif') ||
        v.includes('munkar') ||
        v.includes('mawdu') ||
        v.includes('matruk')
      ){

        weak++;

      }

      else if(
        v.includes('sahih') ||
        v.includes('hasan')
      ){

        strong++;

      }

    }
  );


  if(
    weak > 0 &&
    strong === 0
  ){

    return 'weak';

  }


  if(
    weak > 0 &&
    strong > 0
  ){

    return 'disputed';

  }


  return null;

}
